<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ordini · Grotta Marcello</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="logo.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --ink:#16202b; --ink-2:#31404f; --mut:#7b8a99;
  --paper:#f4f2ed; --card:#ffffff; --line:#dfdcd4;
  --acc:#0b6b5b; --acc-soft:#e3f0ec;
  --ord:#1f6fb2; --con:#0b6b5b;
  --warn:#c0392b; --warn-soft:#fbeceb;
  --amb:#b4700a; --amb-soft:#fdf1dc;
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;padding-bottom:96px}
h1,h2,h3,.dsp{font-family:Archivo,system-ui,sans-serif;letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hide{display:none!important}
header{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.hrow{display:flex;align-items:center;gap:10px}
.htitle{font-family:Archivo;font-weight:700;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsub{font-size:12px;color:#9fb0be;margin-top:2px}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#ffffff1a;color:#fff;font-size:16px;flex:none}
.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 13px;border-radius:999px;background:#ffffff14;color:#c9d5de;font-size:13px;font-weight:500;white-space:nowrap}
.tab.on{background:#fff;color:var(--ink);font-weight:600}
main{padding:14px;max-width:900px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.btn{background:var(--acc);color:#fff;padding:11px 16px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}
.inp{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}
.inp:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:var(--acc)}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.muted{color:var(--mut);font-size:12.5px}
.empty{text-align:center;color:var(--mut);padding:40px 20px}
.flt{margin-bottom:8px}
.flt-lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);font-weight:600;margin-bottom:4px}
.chipbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chipbar::-webkit-scrollbar{display:none}
.chipwrap{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.pos.on{background:var(--amb);border-color:var(--amb)}
.chip.rep.on{background:var(--acc);border-color:var(--acc);color:#fff}
.dif{margin-top:7px;padding:6px 9px;border-radius:8px;background:#eef4fa;color:var(--ord);font-size:12px;font-weight:600}
.badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:600}
.b-open{background:var(--amb-soft);color:var(--amb)}
.b-ord{background:#e6f0f8;color:var(--ord)}
.b-clo{background:var(--acc-soft);color:var(--acc)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-lock{background:#eceff2;color:var(--mut)}
.art{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;margin-bottom:8px}
.art.filled{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.art.noprice{border-color:var(--warn);background:var(--warn-soft)}
.art-top{display:flex;gap:10px;align-items:flex-start}
.art-nm{font-weight:600;line-height:1.3}
.art-meta{font-size:12px;color:var(--mut);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.pos{background:var(--amb-soft);color:var(--amb);padding:1px 7px;border-radius:5px;font-weight:600}
.qty{display:flex;gap:6px;flex:none;align-items:center}
.qty input{width:66px;padding:9px 8px;border:1.5px solid var(--line);border-radius:9px;text-align:center;font-weight:700;font-size:16px;background:#fff}
.qty input.has{border-color:var(--acc);background:var(--acc-soft)}
.qty input:disabled{background:#f4f4f2;color:var(--ink-2);border-style:dashed}
.qty select{padding:9px 4px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13px}
.art-listino{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 12px}
.flags{display:flex;gap:8px;margin-top:9px}
.flag{flex:1;padding:9px;border:1.5px solid var(--line);border-radius:9px;background:#fff;font-size:13px;font-weight:600;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:6px}
.flag.on-ord{border-color:var(--ord);background:#e6f0f8;color:var(--ord)}
.flag.on-con{border-color:var(--con);background:var(--acc-soft);color:var(--con)}
.notebox{margin-top:8px}
.notebox input{width:100%;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;font-size:13px;background:#fcfbf9}
.notebox input:disabled{background:#f4f4f2}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
.savebar .cnt{flex:1;font-size:13px;color:var(--mut)}
.savebar .cnt b{color:var(--warn)}
.ov{position:fixed;inset:0;z-index:60;background:#16202bcc;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{font-size:19px;margin-bottom:4px}
.rep-item{background:#fff;border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:9px 11px;margin-bottom:6px;font-size:14px}
.rep-item .m{font-size:12px;color:var(--mut)}
.umrow{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:6px}
.umrow span{flex:1;font-weight:600}
@media(min-width:700px){ .ov{align-items:center;padding:20px} .sheet{border-radius:16px} }
</style>
</head>
<body>

<div id="v-login">
  <main style="padding-top:60px;max-width:380px">
    <h1 class="dsp" style="font-size:26px">Ordini</h1>
    <p class="muted" style="margin:6px 0 24px">Grotta Marcello</p>
    <div class="card">
      <label class="f"><span>Codice personale</span>
        <input class="inp" id="in-code" type="text" autocomplete="off"></label>
      <button class="btn full" id="btn-login">Entra</button>
      <p id="login-err" class="muted hide" style="color:var(--warn);margin:10px 0 0"></p>
    </div>
  </main>
</div>

<div id="v-app" class="hide">
  <header>
    <div class="hrow">
      <button class="iconbtn hide" id="btn-back">←</button>
      <div style="flex:1;min-width:0">
        <div class="htitle" id="h-title">Ordini</div>
        <div class="hsub" id="h-sub"></div>
      </div>
      <button class="iconbtn" id="btn-menu">⋯</button>
    </div>
    <div class="tabs" id="sector-tabs"></div>
  </header>
  <main id="main"></main>
</div>

<div class="savebar hide" id="savebar">
  <div class="cnt" id="save-cnt"></div>
  <button class="btn" id="btn-save">💾 Salva</button>
</div>
<div id="modal-root"></div>

<script>
/* ============================================================
   CONFIGURAZIONE
   Le chiavi stanno nel file config.js (caricato prima, nel <head>).
   Questo file NON contiene chiavi: si puo' ricaricare per intero
   senza perdere nulla.
   ============================================================ */
if(typeof GM_CONFIG === 'undefined'){
  document.body.innerHTML = '<div style="max-width:420px;margin:60px auto;padding:20px;font-family:sans-serif">'
    + '<h2>Manca il file config.js</h2><p>Carica <b>config.js</b> nella stessa cartella di index.html, '
    + 'con dentro l\'indirizzo e la chiave del database. Senza, l\'app non puo\' collegarsi.</p></div>';
  throw new Error('config.js mancante');
}
const sb = supabase.createClient(GM_CONFIG.url, GM_CONFIG.key);

const SETTORI = {
  cucina:    { nome:'Cucina',       liste:['Cucina e pizzeria'] },
  pizzeria:  { nome:'Pizzeria',     liste:['Cucina e pizzeria'] },
  sala_vini: { nome:'Sala e vini',  liste:['Vini','Sala'] },
  bar:       { nome:'Bar',          liste:['Bar'] }
};
// Cucina e Pizzeria condividono l'anagrafica (settore='cucina'): li divide il reparto
const REPARTO_DI = { cucina:'Cucina', pizzeria:'Pizzeria' };
const articoliDelSettore = set => {
  const rep = REPARTO_DI[set];
  return rep ? S.articoli.filter(a=>a.settore==='cucina' && (a.reparti||[]).includes(rep))
             : S.articoli.filter(a=>a.settore===set);
};
const MIN_CANC = 20;      // minuti entro cui il creatore può cancellare
const GG_CESTINO = 10;    // giorni di permanenza nel cestino

const REPARTI = ['Cucina','Pizzeria','Staff'];   // reparti del settore cucina
const SETTORI_ANAG = ['cucina','sala_vini','bar'];   // pizzeria condivide l'anagrafica di cucina
const settoriAnagUtente = () => {
  const r = [...new Set((S.user?.settori||[]).map(s=>s==='pizzeria'?'cucina':s))].filter(s=>SETTORI_ANAG.includes(s));
  return r.length ? r : ['cucina'];
};
const nomeAnag = s => s==='cucina' ? 'Cucina e pizzeria' : nomeSettore(s);
const S = { user:null, view:'ordini', ordini:[], ordine:null, articoli:[], righe:{}, um:[], chips:[], fornitori:[],
            dirty:new Set(), lista:null, q:'', fRep:null, fCat:null, fPos:null, soloQta:false, alertVisto:false };
const chipList = (settore,tipo) => S.chips.filter(c=>c.settore===settore && c.tipo===tipo).map(c=>c.valore);

const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const oggi = () => new Date().toISOString().slice(0,10);
const dataIT = d => { const [a,m,g]=d.split('-'); return `${g}/${m}/${a}`; };
const nomeSettore = s => SETTORI[s]?.nome || s;
const titoloOrdine = o => dataIT(o.data) + ' · ' + nomeSettore(o.settore);

const isMgr  = () => S.user?.ruolo === 'manager';
const isResp = () => S.user?.ruolo === 'responsabile';
const vedeListino = () => isMgr() || isResp();
const puoFlaggare = () => isMgr() || isResp();
const puoQta = o => isMgr() || isResp() || (o && o.creato_da === S.user.id);
const isProprietario = o => o && o.creato_da === S.user.id;
const puoCancellare = o => {
  if(isMgr()) return true;
  if(!o || o.creato_da !== S.user.id) return false;
  return (Date.now() - new Date(o.creato_il).getTime()) < MIN_CANC*60000;
};
const minutiRimasti = o => Math.max(0, Math.ceil(MIN_CANC - (Date.now()-new Date(o.creato_il).getTime())/60000));

/* ---------------- LOGIN ---------------- */
$('#btn-login').onclick = async () => {
  const cod = $('#in-code').value.trim();
  if(!cod) return;
  const { data, error } = await sb.from('ord_utenti').select('*').eq('codice',cod).eq('attivo',true).maybeSingle();
  const e=$('#login-err');
  if(error){ e.textContent='Non riesco a contattare il database: '+error.message; e.classList.remove('hide'); return; }
  if(!data){ e.textContent='Codice non riconosciuto. Riprova.'; e.classList.remove('hide'); return; }
  S.user=data; localStorage.setItem('gm_ordini_code',cod);
  $('#v-login').classList.add('hide'); $('#v-app').classList.remove('hide');
  await Promise.all([caricaArticoli(), caricaUM(), caricaChip(), caricaFornitori()]);
  if(isMgr()) svuotaCestinoVecchio();
  vistaOrdini();
};
$('#in-code').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#btn-login').click(); });
window.addEventListener('load', ()=>{ const c=localStorage.getItem('gm_ordini_code'); if(c){ $('#in-code').value=c; $('#btn-login').click(); }});

/* ---------------- DATI ---------------- */
async function caricaArticoli(){
  const { data } = await sb.from('ord_articoli').select('*').order('settore').order('lista').order('seq');
  S.articoli = data || [];
}
async function caricaUM(){
  const { data } = await sb.from('ord_um').select('*').order('seq');
  S.um = (data||[]).map(u=>u.valore);
  if(!S.um.length) S.um=['Pz','Kg','Co','Lt'];
}
async function caricaChip(){
  const { data } = await sb.from('ord_chip').select('*').order('settore').order('tipo').order('seq').order('valore');
  S.chips = data || [];
}
async function caricaFornitori(){
  const { data } = await sb.from('ord_fornitori').select('*').eq('attivo',true).order('nome');
  S.fornitori = data || [];
}
async function caricaOrdini(){
  const { data } = await sb.from('ord_ordini').select('*').is('eliminato_il',null).order('data',{ascending:false});
  S.ordini = data || [];
}
async function svuotaCestinoVecchio(){
  const limite = new Date(Date.now() - GG_CESTINO*86400000).toISOString();
  await sb.from('ord_ordini').delete().not('eliminato_il','is',null).lt('eliminato_il',limite);
}

/* ---------------- NAV ---------------- */
$('#btn-back').onclick = ()=>{ if(uscita()) vistaOrdini(); };
$('#btn-menu').onclick = ()=>menu();
function uscita(){
  if(S.dirty.size && !confirm('Ci sono '+S.dirty.size+' modifiche non salvate. Uscire comunque?')) return false;
  S.dirty.clear(); return true;
}
function menu(){
  const v=[['ordini','📋 Ordini'],
    vedeListino()?['archivio','🔎 Archivio ordini']:null,
    ['cestino','🗑 Cestino'],['anagrafica','📖 Anagrafica articoli'],
    vedeListino()?['fornitori','🚚 Fornitori']:null,
    vedeListino()?['chip','🏷 Filtri e categorie']:null,
    vedeListino()?['um','📏 Unità di misura']:null, isMgr()?['utenti','👥 Utenti e accessi']:null,
    ['logout','🚪 Esci']].filter(Boolean);
  modal('Menu', v.map(([k,l])=>`<button class="btn ghost full" style="margin-bottom:8px" data-go="${k}">${l}</button>`).join(''),
    sh=>sh.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
      chiudiModal();
      if(b.dataset.go==='logout'){ localStorage.removeItem('gm_ordini_code'); location.reload(); return; }
      if(!uscita()) return;
      ({ordini:vistaOrdini, archivio:vistaArchivio, cestino:vistaCestino, anagrafica:vistaAnagrafica,
        fornitori:vistaFornitori, chip:vistaChip, um:vistaUM, utenti:vistaUtenti})[b.dataset.go]();
    }));
}

/* ============================================================
   ELENCO ORDINI
   ============================================================ */
async function vistaOrdini(){
  S.view='ordini'; S.ordine=null; S.righe={}; S.dirty.clear(); S.alertVisto=false;
  $('#btn-back').classList.add('hide'); $('#savebar').classList.add('hide'); $('#sector-tabs').innerHTML='';
  $('#h-title').textContent='Ordini';
  $('#h-sub').textContent = S.user.nome + ' · ' + (isMgr()?'manager':isResp()?'responsabile ordini':'operatore');
  $('#main').innerHTML='<p class="muted">Carico…</p>';
  await caricaOrdini();

  const lista = S.ordini.length ? S.ordini.map(o=>{
    const b = o.stato==='chiuso' ? '<span class="badge b-clo">Chiuso</span>'
            : o.stato==='ordini_chiusi' ? '<span class="badge b-ord">Ordini chiusi</span>'
            : '<span class="badge b-open">Aperto</span>';
    const mio = puoQta(o) ? '' : '<span class="badge b-lock">🔒 quantità</span>';
    return `<div class="card" data-o="${o.id}" style="cursor:pointer;display:flex;align-items:center;gap:8px">
      <div style="flex:1">
        <div class="dsp" style="font-size:17px;font-weight:600">${titoloOrdine(o)}</div>
        <div class="muted">creato da ${esc(o.creato_nome||'—')}</div>
      </div>${mio}${b}<span class="muted">›</span></div>`;
  }).join('') : '<div class="empty">Nessun ordine aperto.</div>';

  $('#main').innerHTML = `<button class="btn full" id="btn-new" style="margin-bottom:12px">＋ Nuovo ordine</button>` + lista;
  $('#btn-new').onclick = nuovoOrdine;
  $('#main').querySelectorAll('[data-o]').forEach(c=>c.onclick=()=>apriOrdine(S.ordini.find(o=>o.id==c.dataset.o)));
}

function nuovoOrdine(){
  const mie = S.user.settori;
  modal('Nuovo ordine', `
    <label class="f"><span>Data</span><input class="inp" type="date" id="n-data" value="${oggi()}"></label>
    <label class="f"><span>Settore</span><select class="inp" id="n-set">
      ${mie.map(s=>`<option value="${s}">${nomeSettore(s)}</option>`).join('')}</select></label>
    <p class="muted">Una volta creato, solo tu (e il manager) potrete inserire o modificare le quantità di questo ordine.</p>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn ghost" style="flex:1" id="m-x">Annulla</button>
      <button class="btn" style="flex:1" id="m-ok">Crea ordine</button></div>`,
    sh=>{
      sh.querySelector('#m-x').onclick=chiudiModal;
      sh.querySelector('#m-ok').onclick=async()=>{
        const rec={ data:sh.querySelector('#n-data').value, settore:sh.querySelector('#n-set').value,
                    creato_da:S.user.id, creato_nome:S.user.nome };
        if(!rec.data) return;
        const { data, error } = await sb.from('ord_ordini').insert(rec).select().single();
        if(error){
          alert(error.code==='23505'
            ? 'Esiste già un ordine per questa data e questo settore. Aprilo dall’elenco.'
            : 'Errore: '+error.message);
          return;
        }
        chiudiModal(); apriOrdine(data);
      };
    });
}

/* ============================================================
   DETTAGLIO ORDINE
   ============================================================ */
async function apriOrdine(o){
  S.ordine=o; S.view='ordine'; S.dirty.clear(); S.righe={}; S.q=''; S.fRep=null; S.fCat=null; S.fPos=null; S.soloQta=false;
  S.lista = SETTORI[o.settore].liste.length>1 ? null : SETTORI[o.settore].liste[0];
  const { data } = await sb.from('ord_righe').select('*').eq('ordine_id',o.id);
  (data||[]).forEach(r=>{ if(r.articolo_id) S.righe[r.articolo_id]=r; });
  $('#btn-back').classList.remove('hide');
  renderOrdine();
  if(vedeListino() && !S.alertVisto) alertPrezzi();
}

function riga(a){
  return S.righe[a.id] || (S.righe[a.id]={ ordine_id:S.ordine.id, articolo_id:a.id, nome_snapshot:a.nome,
    settore:S.ordine.settore, lista:a.lista, quantita:null, qta_richiesta:null, qta_um:a.um||S.um[0],
    ordinato:false, consegnato:false, note_riga:null, operatore:S.user.nome });
}

function articoliVisibili(){
  return articoliDelSettore(S.ordine.settore).filter(a=>{
    if(!a.attivo && !(S.righe[a.id]?.quantita>0)) return false;
    if(S.lista && a.lista!==S.lista) return false;
    if(S.fRep && !(a.reparti||[]).includes(S.fRep)) return false;
    if(S.fCat && a.categoria!==S.fCat) return false;
    if(S.fPos && a.posizione!==S.fPos) return false;
    if(S.soloQta && !(S.righe[a.id]?.quantita>0)) return false;
    if(S.q){
      const t=(a.nome+' '+(a.categoria||'')+' '+(a.posizione||'')+' '+(a.produttore||'')+' '+(a.venditore_primario||'')).toLowerCase();
      if(!t.includes(S.q.toLowerCase())) return false;
    }
    return true;
  });
}

function renderOrdine(){
  const o=S.ordine, editabile=puoQta(o);
  $('#h-title').textContent = titoloOrdine(o);
  $('#h-sub').textContent = (o.stato==='chiuso'?'Chiuso':o.stato==='ordini_chiusi'?'Ordini chiusi · scarichi in corso':'Aperto')
    + ' · creato da ' + (o.creato_nome||'—') + (editabile?'':' · quantità in sola lettura');

  // sotto-liste (Vini / Sala)
  const liste = SETTORI[o.settore].liste;
  const t=$('#sector-tabs');
  if(liste.length>1){
    t.innerHTML = `<button class="tab ${!S.lista?'on':''}" data-l="">Tutto</button>` +
      liste.map(l=>`<button class="tab ${S.lista===l?'on':''}" data-l="${l}">${l}</button>`).join('');
    t.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{ S.lista=b.dataset.l||null; S.fCat=null; S.fPos=null; renderOrdine(); });
  } else t.innerHTML='';

  const isCucina = o.settore==='cucina';   // dentro Cucina resta il sotto-filtro Staff
  // chip gestiti + eventuali valori presenti sugli articoli ma non ancora in lista (non si perde nulla)
  const base = articoliDelSettore(o.settore).filter(a=>a.attivo && (!S.lista||a.lista===S.lista));
  const setAnag = (o.settore==='pizzeria') ? 'cucina' : o.settore;
  const cats = [...new Set([...chipList(setAnag,'categoria'), ...base.map(a=>a.categoria).filter(Boolean)])];
  const poss = [...new Set([...chipList(setAnag,'posizione'), ...base.map(a=>a.posizione).filter(Boolean)])];
  const art = articoliVisibili();

  const azioni = [];
  if(puoFlaggare()) azioni.push(`<button class="btn ghost" style="flex:1" id="btn-fo">✓ Fine ordini</button>
                                 <button class="btn ghost" style="flex:1" id="btn-fs">📦 Fine scarichi</button>`);
  if(puoCancellare(o)) azioni.push(`<button class="btn warn" id="btn-del">🗑</button>`);
  const azPdf = vedeListino() ? `<div class="card"><button class="btn full" id="btn-pdf">📄 Esporta PDF per fornitore</button></div>` : '';

  const repRow = isCucina ? `<div class="flt"><div class="flt-lab">Vista rapida</div><div class="chipbar">
      <button class="chip rep ${!S.fRep?'on':''}" data-rep="">Tutti</button>
      <button class="chip rep ${S.fRep==='Staff'?'on':''}" data-rep="Staff">Solo Staff</button>
    </div></div>` : '';

  $('#main').innerHTML = `
    ${azioni.length?`<div class="card" style="display:flex;gap:8px">${azioni.join('')}</div>`:''}
    ${azPdf}
    ${(!isMgr() && !puoCancellare(o) && o.creato_da===S.user.id)
      ? '<p class="muted" style="margin:-4px 0 10px">Finestra di cancellazione scaduta (20 minuti). Solo il manager può cancellare questo ordine.</p>':''}
    ${puoCancellare(o) && !isMgr() ? `<p class="muted" style="margin:-4px 0 10px">Cancellabile ancora per ${minutiRimasti(o)} min.</p>`:''}
    <input class="inp" id="q" placeholder="🔍 Cerca articolo…" value="${esc(S.q)}" style="margin-bottom:10px">
    <button class="chip ${S.soloQta?'on':''}" id="f-qta" style="margin-bottom:10px">${S.soloQta?'✓ ':''}Solo articoli richiesti</button>
    ${repRow}
    <div class="flt"><div class="flt-lab">Settore merceologico</div><div class="chipwrap">
      <button class="chip ${!S.fCat?'on':''}" data-c="">Tutti (${art.length})</button>
      ${cats.map(c=>`<button class="chip ${S.fCat===c?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}
    </div></div>
    ${poss.length?`<div class="flt"><div class="flt-lab">Posizione</div><div class="chipwrap">
      <button class="chip pos ${!S.fPos?'on':''}" data-p="">Tutte</button>
      ${poss.map(p=>`<button class="chip pos ${S.fPos===p?'on':''}" data-p="${esc(p)}">${esc(p)}</button>`).join('')}
    </div></div>`:''}
    <div id="list">${art.map(cardArticolo).join('')||'<div class="empty">Nessun articolo con questi filtri.</div>'}</div>`;

  $('#q').oninput=e=>{ S.q=e.target.value; $('#list').innerHTML=articoliVisibili().map(cardArticolo).join('')||'<div class="empty">Nessun risultato.</div>'; bindRighe(); };
  $('#f-qta').onclick=()=>{ S.soloQta=!S.soloQta; renderOrdine(); };
  $('#main').querySelectorAll('[data-rep]').forEach(b=>b.onclick=()=>{ S.fRep=b.dataset.rep||null; renderOrdine(); });
  $('#main').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ S.fCat=b.dataset.c||null; renderOrdine(); });
  $('#main').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ S.fPos=b.dataset.p||null; renderOrdine(); });
  if(puoFlaggare()){ $('#btn-fo').onclick=fineOrdini; $('#btn-fs').onclick=fineScarichi; }
  if(vedeListino()) $('#btn-pdf').onclick=esportaPDF;
  if(puoCancellare(o)) $('#btn-del').onclick=()=>cancellaOrdine(o);
  bindRighe(); aggiornaSaveBar();
}

function cardArticolo(a){
  const r=S.righe[a.id]||{}, o=S.ordine;
  const editQ = puoQta(o), editF = puoFlaggare();
  const noPrice = vedeListino() && (a.prezzo===null||a.prezzo===undefined);
  const has = r.quantita>0;
  const meta = [
    a.posizione && `<span class="pos">${esc(a.posizione)}</span>`,
    a.categoria && esc(a.categoria),
    a.annata && 'Annata '+esc(a.annata),
    a.produttore && esc(a.produttore),
    a.minimo_ordine && 'min '+esc(a.minimo_ordine),
    a.anticipo && 'anticipo '+esc(a.anticipo),
    !a.attivo && '<span class="badge b-warn">eliminato</span>'
  ].filter(Boolean).join(' · ');
  const listino = vedeListino() ? `<div class="art-listino">
      ${noPrice?'<span class="badge b-warn">⚠ senza prezzo</span>'
               :`<span>💶 <b>${a.prezzo.toLocaleString('it-IT',{minimumFractionDigits:2})} €</b>${a.prezzo_um?'/'+esc(a.prezzo_um):''}</span>`}
      ${a.venditore_primario?`<span>🏷 ${esc(a.venditore_primario)}</span>`:''}
      ${a.venditore_alternativo?`<span class="muted">alt. ${esc(a.venditore_alternativo)}</span>`:''}
      ${a.codice?`<span class="muted">cod. ${esc(a.codice)}</span>`:''}
      ${a.tipo_consegna?`<span class="muted">${esc(a.tipo_consegna)}</span>`:''}</div>`:'';
  const flags = editF ? `<div class="flags">
      <button class="flag ${r.ordinato?'on-ord':''}" data-flag="ordinato" data-id="${a.id}">${r.ordinato?'✓':'○'} Ordinato</button>
      <button class="flag ${r.consegnato?'on-con':''}" data-flag="consegnato" data-id="${a.id}">${r.consegnato?'✓':'○'} Consegnato</button></div>`:'';
  return `<div class="art ${has?'filled':''} ${noPrice?'noprice':''}" id="art-${a.id}">
    <div class="art-top">
      <div style="flex:1;min-width:0">
        <div class="art-nm">${esc(a.nome)}</div>
        <div class="art-meta">${meta}</div>
      </div>
      <div class="qty">
        <input type="number" inputmode="decimal" step="any" min="0" placeholder="0"
          value="${r.quantita??''}" class="${has?'has':''}" data-qta="${a.id}" ${editQ?'':'disabled'}>
        <select data-um="${a.id}" ${editQ?'':'disabled'}>
          ${S.um.map(u=>`<option ${(r.qta_um||a.um)===u?'selected':''}>${u}</option>`).join('')}</select>
      </div>
    </div>
    ${a.note?`<div class="muted" style="margin-top:6px">📝 ${esc(a.note)}</div>`:''}
    <div class="difbox">${badgeDiscrepanza(r)}</div>
    ${listino}${flags}
    <div class="notebox">
      <input placeholder="Nota per questo ordine…" value="${esc(r.note_riga||'')}" data-note="${a.id}" ${editQ?'':'disabled'}>
    </div>
  </div>`;
}

function badgeDiscrepanza(r){
  if(!r || r.qta_richiesta===null || r.qta_richiesta===undefined) return '';
  if(Number(r.qta_richiesta) === Number(r.quantita??0) || !r.qta_modif_da) return '';
  const quando = r.qta_modif_il ? new Date(r.qta_modif_il).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
  return `<div class="dif">richiesti <b>${r.qta_richiesta}</b> → ordinati <b>${r.quantita??0}</b> ${esc(r.qta_um||'')} · modifica di ${esc(r.qta_modif_da)} ${quando}</div>`;
}

function bindRighe(){
  const art = id => S.articoli.find(x=>x.id==id);
  $('#main').querySelectorAll('[data-qta]').forEach(i=>i.onchange=e=>{
    const a=art(i.dataset.qta), r=riga(a), v=e.target.value===''?null:parseFloat(e.target.value);
    const nuovaQ = (v===null||isNaN(v))?null:v;
    if(isProprietario(S.ordine)){
      // il capo reparto scrive la richiesta originale
      r.quantita=nuovaQ; r.qta_richiesta=nuovaQ; r.operatore=S.user.nome;
    } else {
      // responsabile o manager: la richiesta resta congelata, si traccia la variazione
      if(r.qta_richiesta===null || r.qta_richiesta===undefined) r.qta_richiesta = r.quantita ?? null;
      r.quantita=nuovaQ;
      if(r.qta_richiesta !== nuovaQ){ r.qta_modif_da=S.user.nome; r.qta_modif_il=new Date().toISOString(); }
      else { r.qta_modif_da=null; r.qta_modif_il=null; }
    }
    e.target.classList.toggle('has', r.quantita>0);
    const card=document.getElementById('art-'+a.id);
    card.classList.toggle('filled', r.quantita>0);
    const dif=card.querySelector('.difbox');
    if(dif) dif.innerHTML = badgeDiscrepanza(r);
    S.dirty.add(a.id); aggiornaSaveBar();
  });
  $('#main').querySelectorAll('[data-um]').forEach(s=>s.onchange=e=>{
    const a=art(s.dataset.um); riga(a).qta_um=e.target.value; S.dirty.add(a.id); aggiornaSaveBar();
  });
  $('#main').querySelectorAll('[data-note]').forEach(i=>i.onchange=e=>{
    const a=art(i.dataset.note); riga(a).note_riga=e.target.value||null; S.dirty.add(a.id); aggiornaSaveBar();
  });
  $('#main').querySelectorAll('[data-flag]').forEach(b=>b.onclick=()=>{
    const a=art(b.dataset.id), r=riga(a), f=b.dataset.flag;
    r[f]=!r[f];
    if(f==='ordinato'){ r.ordinato_il=r.ordinato?new Date().toISOString():null; if(!r.ordinato){ r.consegnato=false; r.consegnato_il=null; } }
    if(f==='consegnato') r.consegnato_il=r.consegnato?new Date().toISOString():null;
    S.dirty.add(a.id);
    const p=b.parentElement;
    const bo=p.querySelector('[data-flag="ordinato"]'), bc=p.querySelector('[data-flag="consegnato"]');
    bo.className='flag '+(r.ordinato?'on-ord':''); bo.textContent=(r.ordinato?'✓':'○')+' Ordinato';
    bc.className='flag '+(r.consegnato?'on-con':''); bc.textContent=(r.consegnato?'✓':'○')+' Consegnato';
    aggiornaSaveBar();
  });
}

function aggiornaSaveBar(){
  const b=$('#savebar');
  if(S.view!=='ordine' || (!puoQta(S.ordine) && !puoFlaggare())){ b.classList.add('hide'); return; }
  b.classList.remove('hide');
  $('#save-cnt').innerHTML = S.dirty.size?`<b>${S.dirty.size}</b> modifiche da salvare`:'Tutto salvato';
  $('#btn-save').disabled = !S.dirty.size;
}

$('#btn-save').onclick = async () => {
  const btn=$('#btn-save'); btn.disabled=true; btn.textContent='Salvo…';
  const up=[], del=[];
  for(const id of S.dirty){
    const r=S.righe[id];
    const vuota = !(r.quantita>0) && !r.ordinato && !r.consegnato && !r.note_riga;
    if(vuota && r.id) del.push(r.id);
    else if(!vuota) up.push({ id:r.id, ordine_id:r.ordine_id, articolo_id:r.articolo_id, nome_snapshot:r.nome_snapshot,
      settore:r.settore, lista:r.lista, quantita:r.quantita, qta_richiesta:r.qta_richiesta??null, qta_um:r.qta_um,
      qta_modif_da:r.qta_modif_da||null, qta_modif_il:r.qta_modif_il||null, fornitore:r.fornitore||null,
      ordinato:r.ordinato, ordinato_il:r.ordinato_il||null, consegnato:r.consegnato, consegnato_il:r.consegnato_il||null,
      note_riga:r.note_riga, operatore:r.operatore, aggiornato_il:new Date().toISOString() });
  }
  let err=null;
  if(del.length){ const {error}=await sb.from('ord_righe').delete().in('id',del); if(error) err=error;
    del.forEach(id=>{ const k=Object.keys(S.righe).find(k=>S.righe[k].id===id); if(k) delete S.righe[k]; }); }
  if(up.length){
    const rows=up.map(r=>{ const c={...r}; if(!c.id) delete c.id; return c; });
    const { data, error } = await sb.from('ord_righe').upsert(rows,{onConflict:'ordine_id,articolo_id'}).select();
    if(error) err=error; else (data||[]).forEach(r=>{ S.righe[r.articolo_id]=r; });
  }
  btn.textContent='💾 Salva';
  if(err){ alert('Errore nel salvataggio: '+err.message); btn.disabled=false; return; }
  S.dirty.clear(); aggiornaSaveBar(); toast('Salvato');
};

/* ---------------- CANCELLAZIONE ---------------- */
function cancellaOrdine(o){
  const tardi = isMgr() && !( o.creato_da===S.user.id && (Date.now()-new Date(o.creato_il).getTime())<MIN_CANC*60000 );
  modal('Cancellare l\'ordine?', `
    <p><b>${titoloOrdine(o)}</b> — creato da ${esc(o.creato_nome||'—')}.</p>
    <p class="muted">Finisce nel cestino e resta recuperabile per ${GG_CESTINO} giorni. Dopo, viene eliminato definitivamente.</p>
    ${tardi?'<p class="muted">Stai cancellando fuori dalla finestra dei 20 minuti: puoi farlo perché sei manager.</p>':''}
    <label class="f"><span>Conferma col tuo codice personale</span>
      <input class="inp" type="password" id="c-pwd" autocomplete="off"></label>
    <p id="c-err" class="muted hide" style="color:var(--warn)"></p>
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn ghost" style="flex:1" id="m-x">Annulla</button>
      <button class="btn warn" style="flex:1" id="m-ok">Sposta nel cestino</button></div>`,
    sh=>{
      sh.querySelector('#m-x').onclick=chiudiModal;
      sh.querySelector('#m-ok').onclick=async()=>{
        if(sh.querySelector('#c-pwd').value.trim()!==S.user.codice){
          const e=sh.querySelector('#c-err'); e.textContent='Codice errato.'; e.classList.remove('hide'); return;
        }
        const { error } = await sb.from('ord_ordini')
          .update({ eliminato_il:new Date().toISOString(), eliminato_da:S.user.nome }).eq('id',o.id);
        if(error){ alert('Errore: '+error.message); return; }
        chiudiModal(); vistaOrdini(); toast('Ordine spostato nel cestino');
      };
    });
}

/* ---------------- CESTINO ---------------- */
async function vistaCestino(){
  S.view='cestino'; $('#savebar').classList.add('hide'); $('#btn-back').classList.remove('hide'); $('#sector-tabs').innerHTML='';
  $('#h-title').textContent='Cestino';
  $('#h-sub').textContent=`Gli ordini restano ${GG_CESTINO} giorni, poi spariscono`;
  const { data } = await sb.from('ord_ordini').select('*').not('eliminato_il','is',null).order('eliminato_il',{ascending:false});
  let lista = data||[];
  if(!isMgr() && !isResp()) lista = lista.filter(o=>o.creato_da===S.user.id);
  $('#main').innerHTML = lista.length ? lista.map(o=>{
    const gg = Math.max(0, GG_CESTINO - Math.floor((Date.now()-new Date(o.eliminato_il).getTime())/86400000));
    const puoRip = isMgr() || o.creato_da===S.user.id;
    return `<div class="card" style="display:flex;align-items:center;gap:10px">
      <div style="flex:1">
        <div class="dsp" style="font-size:16px;font-weight:600">${titoloOrdine(o)}</div>
        <div class="muted">cancellato da ${esc(o.eliminato_da||'—')} · resta ancora ${gg} ${gg===1?'giorno':'giorni'}</div>
      </div>
      ${puoRip?`<button class="btn ghost" data-r="${o.id}">↩ Ripristina</button>`:'<span class="badge b-lock">🔒</span>'}
    </div>`;
  }).join('') : '<div class="empty">Il cestino è vuoto.</div>';
  $('#main').querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{
    const { error } = await sb.from('ord_ordini').update({eliminato_il:null, eliminato_da:null}).eq('id',b.dataset.r);
    if(error){ alert(error.code==='23505' ? 'Esiste già un ordine attivo per quella data e settore: non posso ripristinarlo.' : 'Errore: '+error.message); return; }
    vistaCestino(); toast('Ordine ripristinato');
  });
}

  const senza = articoliDelSettore(S.ordine.settore).filter(a=>a.attivo && (a.prezzo===null||a.prezzo===undefined));
  if(!senza.length) return;

    `<p>In <b>${nomeSettore(S.ordine.settore)}</b> ci sono <b>${senza.length} articoli</b> senza prezzo a listino. Nell'elenco sono evidenziati in rosso.</p>
     <button class="btn full" id="m-ok">Ho capito</button>`,
    sh=>sh.querySelector('#m-ok').onclick=chiudiModal);
}

/* ---------------- FINE ORDINI / SCARICHI ---------------- */
async function ricaricaRighe(){
  const { data } = await sb.from('ord_righe').select('*').eq('ordine_id',S.ordine.id);
  S.righe={}; (data||[]).forEach(r=>{ if(r.articolo_id) S.righe[r.articolo_id]=r; });
}
const rip = r => `<div class="rep-item"><b>${esc(r.nome_snapshot)}</b> — ${r.quantita} ${esc(r.qta_um||'')}</div>`;

async function fineOrdini(){
  if(S.dirty.size){ alert('Salva prima le modifiche in sospeso.'); return; }
  await ricaricaRighe();
  const manc = Object.values(S.righe).filter(r=>r.quantita>0 && !r.ordinato);
  const tot  = Object.values(S.righe).filter(r=>r.quantita>0).length;
  const varia = Object.values(S.righe).filter(r=>r.qta_richiesta!=null && Number(r.qta_richiesta)!==Number(r.quantita||0));
  const rep = { generato_il:new Date().toISOString(), da:S.user.nome, totale_richiesti:tot,
                non_ordinati:manc.map(r=>({nome:r.nome_snapshot,q:r.quantita,um:r.qta_um})),
                variazioni:varia.map(r=>({nome:r.nome_snapshot, richiesta:r.qta_richiesta, finale:r.quantita, um:r.qta_um, da:r.qta_modif_da})) };
  modal('Fine ordini · '+titoloOrdine(S.ordine),
    `<p class="muted" style="margin:0 0 12px">${tot} articoli richiesti · <b style="color:${manc.length?'var(--warn)':'var(--acc)'}">${manc.length} non ordinati</b></p>
     ${manc.length?manc.map(rip).join(''):'<div class="card" style="text-align:center;color:var(--acc)"><b>Tutto ordinato.</b></div>'}
     ${varia.length?`<h3 style="margin:16px 0 8px;font-size:14px">Quantità variate rispetto alla richiesta (${varia.length})</h3>`
       + varia.map(r=>`<div class="rep-item" style="border-left-color:var(--ord)">
           <b>${esc(r.nome_snapshot)}</b><div class="m">richiesti ${r.qta_richiesta} → ordinati ${r.quantita||0} ${esc(r.qta_um||'')} · ${esc(r.qta_modif_da||'—')}</div></div>`).join('') : ''}
     <div style="display:flex;gap:8px;margin-top:14px">
       <button class="btn ghost" style="flex:1" id="m-x">Chiudi</button>
       <button class="btn" style="flex:1" id="m-ok">Conferma fine ordini</button></div>`,
    sh=>{
      sh.querySelector('#m-x').onclick=chiudiModal;
      sh.querySelector('#m-ok').onclick=async()=>{
        await sb.from('ord_ordini').update({stato:'ordini_chiusi', chiuso_ordini_il:new Date().toISOString(), report_ordini:rep}).eq('id',S.ordine.id);
        S.ordine.stato='ordini_chiusi'; chiudiModal(); renderOrdine(); toast('Ordini chiusi');
      };
    });
}

async function fineScarichi(){
  if(S.dirty.size){ alert('Salva prima le modifiche in sospeso.'); return; }
  await ricaricaRighe();
  const manc = Object.values(S.righe).filter(r=>r.ordinato && !r.consegnato);
  const nonOrd = Object.values(S.righe).filter(r=>r.quantita>0 && !r.ordinato);
  const tot = Object.values(S.righe).filter(r=>r.ordinato).length;
  const rep = { generato_il:new Date().toISOString(), da:S.user.nome, totale_ordinati:tot,
                non_consegnati:manc.map(r=>({nome:r.nome_snapshot,q:r.quantita,um:r.qta_um})),
                mai_ordinati:nonOrd.map(r=>({nome:r.nome_snapshot,q:r.quantita,um:r.qta_um})) };
  modal('Fine scarichi · '+titoloOrdine(S.ordine),
    `<p class="muted" style="margin:0 0 12px">${tot} articoli ordinati · <b style="color:${manc.length?'var(--warn)':'var(--acc)'}">${manc.length} non consegnati</b></p>
     ${manc.length?manc.map(rip).join(''):'<div class="card" style="text-align:center;color:var(--acc)"><b>Tutto consegnato.</b></div>'}
     ${nonOrd.length?`<h3 style="margin:16px 0 8px;font-size:14px">Richiesti ma mai ordinati (${nonOrd.length})</h3>`+nonOrd.map(rip).join(''):''}
     <div style="display:flex;gap:8px;margin-top:14px">
       <button class="btn ghost" style="flex:1" id="m-x">Chiudi</button>
       <button class="btn" style="flex:1" id="m-ok">Conferma fine scarichi</button></div>`,
    sh=>{
      sh.querySelector('#m-x').onclick=chiudiModal;
      sh.querySelector('#m-ok').onclick=async()=>{
        await sb.from('ord_ordini').update({stato:'chiuso', chiuso_scarichi_il:new Date().toISOString(), report_scarichi:rep}).eq('id',S.ordine.id);

/* ---------------- FILTRI E CATEGORIE (chip) ---------------- */
async function vistaChip(){
  S.view='chip'; S.setC = S.setC || settoriAnagUtente()[0];
  $('#savebar').classList.add('hide'); $('#btn-back').classList.remove('hide');
  $('#h-title').textContent='Filtri e categorie';
  $('#h-sub').textContent='Settori merceologici e posizioni';
  const t=$('#sector-tabs');
  t.innerHTML = settoriAnagUtente().map(s=>`<button class="tab ${S.setC===s?'on':''}" data-s="${s}">${nomeAnag(s)}</button>`).join('');
  t.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ S.setC=b.dataset.s; vistaChip(); });
  await caricaChip();
  render();

  function blocco(tipo, titolo){
    const voci = S.chips.filter(c=>c.settore===S.setC && c.tipo===tipo);
    return `<h3 style="margin:16px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)">${titolo}</h3>
      <div class="card"><div style="display:flex;gap:8px">
        <input class="inp" id="new-${tipo}" placeholder="Aggiungi…">
        <button class="btn" data-add="${tipo}">Aggiungi</button></div></div>
      ${voci.length?voci.map(c=>`<div class="umrow">
        <span>${esc(c.valore)}</span>
        <button class="btn ghost" data-ren="${c.id}" data-val="${esc(c.valore)}" data-tipo="${tipo}" style="padding:6px 10px">✏️</button>
        <button class="btn ghost" data-del="${c.id}" data-val="${esc(c.valore)}" data-tipo="${tipo}" style="padding:6px 10px">🗑</button>
      </div>`).join(''):'<p class="muted" style="margin:0 0 8px">Nessuna voce.</p>'}`;
  }

  function render(){
    $('#main').innerHTML = `<p class="muted">Le voci qui sotto compaiono come filtri negli ordini e come opzioni nella scheda articolo.</p>`
      + blocco('categoria','Settore merceologico') + blocco('posizione','Posizione');
    // aggiungi
    $('#main').querySelectorAll('[data-add]').forEach(b=>b.onclick=async()=>{
      const tipo=b.dataset.add, v=$('#new-'+tipo).value.trim(); if(!v) return;
      const seq=S.chips.filter(c=>c.settore===S.setC&&c.tipo===tipo).length+1;
      const { error } = await sb.from('ord_chip').insert({settore:S.setC, tipo, valore:v, seq});
      if(error){ alert(error.code==='23505'?'Questa voce esiste già.':'Errore: '+error.message); return; }
      await caricaChip(); render(); toast('Voce aggiunta');
    });
    // rinomina (aggiorna anche gli articoli che la usano)
    $('#main').querySelectorAll('[data-ren]').forEach(b=>b.onclick=async()=>{
      const tipo=b.dataset.tipo, vecchio=b.dataset.val;
      const nuovo=prompt('Rinomina "'+vecchio+'" in:', vecchio);
      if(!nuovo || nuovo.trim()===vecchio) return;
      const val=nuovo.trim();
      const u1 = await sb.from('ord_chip').update({valore:val}).eq('id',b.dataset.ren);
      if(u1.error){ alert(u1.error.code==='23505'?'Esiste già una voce con questo nome.':'Errore: '+u1.error.message); return; }
      const campo = tipo==='categoria'?'categoria':'posizione';
      await sb.from('ord_articoli').update({[campo]:val}).eq('settore',S.setC).eq(campo,vecchio);
      await Promise.all([caricaChip(), caricaArticoli()]); render(); toast('Rinominata ovunque');
    });
    // elimina (gli articoli che la usavano restano senza quella voce)
    $('#main').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      const tipo=b.dataset.tipo, val=b.dataset.val, campo=tipo==='categoria'?'categoria':'posizione';
      const { count } = await sb.from('ord_articoli').select('id',{count:'exact',head:true}).eq('settore',S.setC).eq(campo,val);
      if(!confirm(`Eliminare "${val}"?`+(count?`\n\n${count} articoli la usano: resteranno senza ${tipo}. Gli ordini già salvati non cambiano.`:''))) return;
      await sb.from('ord_chip').delete().eq('id',b.dataset.del);
      if(count) await sb.from('ord_articoli').update({[campo]:null}).eq('settore',S.setC).eq(campo,val);
      await Promise.all([caricaChip(), caricaArticoli()]); render(); toast('Voce eliminata');
    });
  }
}

      </select></label>
    </div>
    <label class="f rep-field" style="display:${a.settore==='cucina'?'block':'none'}"><span>In quali ordini deve comparire</span>

/* ============================================================
   PDF PER FORNITORE
   ============================================================ */
const fornitoreDiRiga = (r,a) => {
  if(r.fornitore) return r.fornitore;
  const v = a?.venditore_primario?.trim();
  if(!v) return null;
  return v.includes('/') ? null : v;   // multiplo = da scegliere
};

async function esportaPDF(){
  if(S.dirty.size){ alert('Salva prima le modifiche in sospeso.'); return; }
  await ricaricaRighe();
  const righe = Object.values(S.righe).filter(r=>r.quantita>0);
  if(!righe.length){ alert('Questo ordine non ha ancora quantità da esportare.'); return; }

  const daAssegnare = righe.filter(r=>{
    const a = S.articoli.find(x=>x.id===r.articolo_id);
    return !fornitoreDiRiga(r,a);
  });
  if(daAssegnare.length) return assegnaFornitori(daAssegnare, ()=>esportaPDF());
  scegliFornitorePDF(righe);
}

function assegnaFornitori(righe, poi){
  const opts = S.fornitori.map(f=>f.nome);
  const corpo = righe.map((r,i)=>{
    const a = S.articoli.find(x=>x.id===r.articolo_id);
    const sugg = a?.venditore_primario?.includes('/')
      ? a.venditore_primario.split('/').map(s=>s.trim()).filter(Boolean) : [];
    const lista = [...new Set([...sugg, ...opts])];
    return `<div class="card" style="padding:10px">
      <div style="font-weight:600;margin-bottom:6px">${esc(r.nome_snapshot)} <span class="muted">— ${r.quantita} ${esc(r.qta_um||'')}</span></div>
      ${sugg.length?`<div class="muted" style="margin-bottom:5px">indicati a listino: ${esc(sugg.join(' · '))}</div>`:'<div class="muted" style="margin-bottom:5px">nessun fornitore a listino</div>'}
      <select class="inp" data-f="${i}">
        <option value="">— scegli fornitore —</option>
        ${lista.map(n=>`<option>${esc(n)}</option>`).join('')}
      </select></div>`;
  }).join('');
  modal('A chi ordiniamo?', `
    <p class="muted">${righe.length} articoli non hanno un fornitore univoco. Scegli per questo ordine: la scelta resta salvata sulla riga e non modifica l'anagrafica.</p>
    ${corpo}
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn ghost" style="flex:1" id="m-x">Annulla</button>
      <button class="btn" style="flex:1" id="m-ok">Conferma e continua</button></div>`,
    sh=>{
      sh.querySelector('#m-x').onclick=chiudiModal;
      sh.querySelector('#m-ok').onclick=async()=>{
        const upd=[];
        righe.forEach((r,i)=>{
          const v=sh.querySelector(`[data-f="${i}"]`).value;
          if(v){ r.fornitore=v; upd.push({id:r.id, fornitore:v}); }
        });
        if(upd.length!==righe.length){ alert('Assegna un fornitore a tutti gli articoli elencati.'); return; }
        for(const u of upd) await sb.from('ord_righe').update({fornitore:u.fornitore}).eq('id',u.id);
        chiudiModal(); poi();
      };
    });
}

function scegliFornitorePDF(righe){
  const gruppi = {};
  righe.forEach(r=>{
    const a=S.articoli.find(x=>x.id===r.articolo_id);
    const f=fornitoreDiRiga(r,a) || 'Senza fornitore';
    (gruppi[f]=gruppi[f]||[]).push({r,a});
  });
  const nomi=Object.keys(gruppi).sort();
  modal('Esporta PDF · '+titoloOrdine(S.ordine),
    `<p class="muted">Un documento per ogni fornitore.</p>
     ${nomi.map(n=>{
       const f=S.fornitori.find(x=>x.nome===n);
       return `<div class="card" style="display:flex;align-items:center;gap:8px">
         <div style="flex:1">
           <div style="font-weight:600">${esc(n)}</div>
           <div class="muted">${gruppi[n].length} articoli${f?.email?' · '+esc(f.email):' · nessuna email in anagrafica'}</div>
         </div>
         <button class="btn ghost" data-pdf="${esc(n)}" style="padding:8px 12px">📄</button>
         <button class="btn ghost" data-shr="${esc(n)}" style="padding:8px 12px">📤</button>
         ${f?.email?`<button class="btn ghost" data-mail="${esc(n)}" style="padding:8px 12px">✉️</button>`:''}
       </div>`;
     }).join('')}
     <p class="muted" style="margin-top:10px">📄 scarica · 📤 condividi (telefono) · ✉️ apri email già compilata, poi allega il PDF scaricato</p>
     <button class="btn ghost full" id="m-x" style="margin-top:8px">Chiudi</button>`,
    sh=>{
      sh.querySelector('#m-x').onclick=chiudiModal;
      sh.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>generaPDF(b.dataset.pdf, gruppi[b.dataset.pdf],'save'));
      sh.querySelectorAll('[data-shr]').forEach(b=>b.onclick=()=>generaPDF(b.dataset.shr, gruppi[b.dataset.shr],'share'));
      sh.querySelectorAll('[data-mail]').forEach(b=>b.onclick=()=>{
        const n=b.dataset.mail, f=S.fornitori.find(x=>x.nome===n);
        generaPDF(n, gruppi[n], 'save');
        const ogg=encodeURIComponent(`Ordine Grotta Marcello ${dataIT(S.ordine.data)} — ${nomeSettore(S.ordine.settore)}`);
        const corpo=encodeURIComponent(`Buongiorno,\nin allegato l'ordine del ${dataIT(S.ordine.data)} per ${nomeSettore(S.ordine.settore)}.\n\nGrazie,\nGrotta Marcello`);
        setTimeout(()=>{ location.href=`mailto:${f.email}?subject=${ogg}&body=${corpo}`; }, 700);
      });
    });
}

function generaPDF(fornitore, voci, modo){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const o = S.ordine;
  const VIOLA = [107,61,92];      // #6B3D5C
  const GRIGIO = [123,107,117];
  const pw = doc.internal.pageSize.getWidth();
  let y = 14;

  // --- logo centrato (piccolo) ---
  if(typeof GM_LOGO !== 'undefined'){
    const lw = 42, lh = lw * (typeof GM_LOGO_RATIO!=='undefined'?GM_LOGO_RATIO:0.4269);
    try { doc.addImage(GM_LOGO, 'JPEG', (pw-lw)/2, y, lw, lh); y += lh + 3; }
    catch(e){ y += 2; }
  } else {
    doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(...VIOLA);
    doc.text('GROTTA MARCELLO', pw/2, y+6, {align:'center'}); y += 12;
  }
  // linea viola
  doc.setDrawColor(...VIOLA); doc.setLineWidth(0.6);
  doc.line(16, y, pw-16, y); y += 7;

  // --- intestazione: sinistra dati ordine, destra fornitore ---
  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(0);
  doc.text('ORDINE FORNITORE', 16, y);
  doc.setFont('helvetica','bold'); doc.setTextColor(...VIOLA); doc.setFontSize(11);
  doc.text(String(fornitore), pw-16, y, {align:'right'});
  y += 5;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...GRIGIO);
  doc.text('Data ordine: ' + dataIT(o.data), 16, y);
  const forn = S.fornitori.find(f=>f.nome===fornitore);
  if(forn?.email){ doc.text(forn.email, pw-16, y, {align:'right'}); }
  y += 4.5;
  doc.text('Reparto: ' + nomeSettore(o.settore), 16, y); y += 4.5;
  doc.text('Compilato da: ' + S.user.nome, 16, y); y += 6;

  // --- tabella: Codice | Prodotto | Q.tà | U.M. | Note ---
  doc.autoTable({
    startY: y,
    head: [['Codice','Prodotto','Q.tà','U.M.','Note']],
    body: voci.map(({r,a})=>[ a?.codice||'', r.nome_snapshot, String(r.quantita), r.qta_um||(a?.um||''), r.note_riga||'' ]),
    styles:{ fontSize:9, cellPadding:2.6, textColor:[40,40,40] },
    headStyles:{ fillColor:VIOLA, textColor:255, fontStyle:'bold' },
    alternateRowStyles:{ fillColor:[242,234,239] },
    columnStyles:{ 0:{cellWidth:22}, 1:{cellWidth:74}, 2:{cellWidth:14, halign:'right'}, 3:{cellWidth:16}, 4:{cellWidth:52, textColor:GRIGIO, fontSize:8.5} },
    margin:{ left:16, right:16 }
  });

  let yf = doc.lastAutoTable.finalY + 6;
  doc.setFontSize(9); doc.setTextColor(...GRIGIO);
  doc.text(`${voci.length} ${voci.length===1?'articolo':'articoli'} · generato il ${new Date().toLocaleString('it-IT')}`, 16, yf);

  // piè di pagina
  const ph = doc.internal.pageSize.getHeight();
  doc.setFontSize(8); doc.setTextColor(...GRIGIO);
  doc.text('Grotta Marcello · Rifugio del gusto · Cagliari', pw/2, ph-12, {align:'center'});

  const nomeFile = `Ordine_${o.data}_${nomeSettore(o.settore).replace(/\s/g,'')}_${fornitore.replace(/[^\w]/g,'')}.pdf`;
  if(modo==='share' && navigator.share){
    const blob = doc.output('blob');
    const file = new File([blob], nomeFile, {type:'application/pdf'});
    navigator.share({ files:[file], title:nomeFile }).catch(()=>doc.save(nomeFile));
  } else doc.save(nomeFile);
}

/* ============================================================
   ARCHIVIO — quanto abbiamo ordinato di X in un periodo
   ============================================================ */
async function vistaArchivio(){
  S.view='archivio'; $('#savebar').classList.add('hide'); $('#btn-back').classList.remove('hide'); $('#sector-tabs').innerHTML='';
  $('#h-title').textContent='Archivio ordini';
  $('#h-sub').textContent='Quanto è stato ordinato, e quando';
  const a30 = new Date(Date.now()-30*86400000).toISOString().slice(0,10);
  $('#main').innerHTML = `
    <div class="card">
      <label class="f"><span>Articolo (anche parte del nome)</span>
        <input class="inp" id="ar-q" placeholder="es. pomodoro cherry"></label>
      <div class="grid2">
        <label class="f"><span>Dal</span><input class="inp" type="date" id="ar-d1" value="${a30}"></label>
        <label class="f"><span>Al</span><input class="inp" type="date" id="ar-d2" value="${oggi()}"></label>
      </div>
      <label class="f"><span>Settore</span><select class="inp" id="ar-set">
        <option value="">Tutti</option>
        ${S.user.settori.map(s=>`<option value="${s}">${nomeSettore(s)}</option>`).join('')}</select></label>
      <button class="btn full" id="ar-go">🔎 Cerca</button>
    </div>
    <div id="ar-res"></div>`;
  $('#ar-go').onclick=cerca;
  $('#ar-q').addEventListener('keydown',e=>{ if(e.key==='Enter') cerca(); });

  async function cerca(){
    const q=$('#ar-q').value.trim(), d1=$('#ar-d1').value, d2=$('#ar-d2').value, set=$('#ar-set').value;
    const res=$('#ar-res'); res.innerHTML='<p class="muted">Cerco…</p>';
    let sel = sb.from('ord_righe').select('*, ord_ordini!inner(data,settore,stato,eliminato_il,creato_nome)')
      .gt('quantita',0).is('ord_ordini.eliminato_il',null);
    if(d1) sel = sel.gte('ord_ordini.data', d1);
    if(d2) sel = sel.lte('ord_ordini.data', d2);
    if(set) sel = sel.eq('ord_ordini.settore', set);
    if(q)   sel = sel.ilike('nome_snapshot', '%'+q+'%');
    const { data, error } = await sel;
    if(error){ res.innerHTML='<p class="muted" style="color:var(--warn)">Errore: '+esc(error.message)+'</p>'; return; }
    const righe = data||[];
    if(!righe.length){ res.innerHTML='<div class="empty">Nessun ordine trovato in questo periodo.</div>'; return; }

    // totali per articolo e unità di misura
    const per = {};
    righe.forEach(r=>{
      const k = r.nome_snapshot + '||' + (r.qta_um||'');
      per[k] = per[k] || { nome:r.nome_snapshot, um:r.qta_um||'', tot:0, righe:[] };
      per[k].tot += Number(r.quantita||0);
      per[k].righe.push(r);
    });
    const gruppi = Object.values(per).sort((a,b)=>b.tot-a.tot);

    res.innerHTML = `
      <h3 style="margin:6px 0 10px;font-size:14px">${gruppi.length} ${gruppi.length===1?'articolo':'articoli'} · ${dataIT(d1)} → ${dataIT(d2)}</h3>
      ${gruppi.map((g,i)=>`
        <div class="card">
          <div style="display:flex;align-items:baseline;gap:8px">
            <div style="flex:1;font-weight:600">${esc(g.nome)}</div>
            <div class="dsp" style="font-size:20px;font-weight:700;color:var(--acc)">${g.tot.toLocaleString('it-IT')} ${esc(g.um)}</div>
          </div>
          <button class="chip" data-det="${i}" style="margin-top:8px">Dettaglio (${g.righe.length} ordini)</button>
          <div id="det-${i}" class="hide" style="margin-top:8px">
            ${g.righe.sort((x,y)=>x.ord_ordini.data.localeCompare(y.ord_ordini.data)).map(r=>{
              const dif = (r.qta_richiesta!=null && Number(r.qta_richiesta)!==Number(r.quantita))
                ? ` <span class="muted">(richiesti ${r.qta_richiesta}, variati da ${esc(r.qta_modif_da||'—')})</span>` : '';
              return `<div style="padding:6px 0;border-top:1px solid var(--line);font-size:13.5px">
                <b>${dataIT(r.ord_ordini.data)}</b> · ${nomeSettore(r.ord_ordini.settore)} — ${r.quantita} ${esc(r.qta_um||'')}${dif}
                ${r.fornitore?` · ${esc(r.fornitore)}`:''}
                ${r.consegnato?' · <span style="color:var(--acc)">consegnato</span>':r.ordinato?' · <span style="color:var(--ord)">ordinato</span>':' · <span style="color:var(--warn)">non ordinato</span>'}
              </div>`;
            }).join('')}
          </div>
        </div>`).join('')}`;
    res.querySelectorAll('[data-det]').forEach(b=>b.onclick=()=>{
      const d=document.getElementById('det-'+b.dataset.det); d.classList.toggle('hide');
    });
  }
}

/* ============================================================
   ANAGRAFICA FORNITORI
   ============================================================ */
async function vistaFornitori(){
  S.view='fornitori'; $('#savebar').classList.add('hide'); $('#btn-back').classList.remove('hide'); $('#sector-tabs').innerHTML='';
  $('#h-title').textContent='Fornitori'; $('#h-sub').textContent='Nome ed email per l’invio degli ordini';
  await caricaFornitori();
  $('#main').innerHTML = '<button class="btn full" id="btn-addf" style="margin-bottom:10px">＋ Nuovo fornitore</button>' +
    (S.fornitori.map(f=>`<div class="card" data-f="${f.id}" style="cursor:pointer;display:flex;align-items:center;gap:10px">
      <div style="flex:1">
        <div style="font-weight:600">${esc(f.nome)}</div>
        <div class="muted">${f.email?esc(f.email):'<span style="color:var(--warn)">nessuna email</span>'}${f.telefono?' · '+esc(f.telefono):''}</div>
      </div><span class="muted">›</span></div>`).join('') || '<div class="empty">Nessun fornitore.</div>');
  $('#btn-addf').onclick=()=>schedaFornitore(null);
  $('#main').querySelectorAll('[data-f]').forEach(c=>c.onclick=()=>schedaFornitore(S.fornitori.find(f=>f.id==c.dataset.f)));
}

function schedaFornitore(f){
  const nuovo=!f; f = f || { nome:'', email:'', telefono:'', note:'' };
  modal(nuovo?'Nuovo fornitore':'Scheda fornitore', `
    <label class="f"><span>Nome</span><input class="inp" id="f-nome" value="${esc(f.nome)}"></label>
    <label class="f"><span>Email</span><input class="inp" id="f-mail" type="email" value="${esc(f.email||'')}"></label>
    <label class="f"><span>Telefono</span><input class="inp" id="f-tel" value="${esc(f.telefono||'')}"></label>
    <label class="f"><span>Note</span><textarea class="inp" rows="2" id="f-note">${esc(f.note||'')}</textarea></label>
    <div style="display:flex;gap:8px;margin-top:6px">
      ${!nuovo?'<button class="btn warn" id="m-del">🗑</button>':''}
      <button class="btn ghost" style="flex:1" id="m-x">Annulla</button>
      <button class="btn" style="flex:1" id="m-ok">💾 Salva</button></div>`,
   sh=>{
     sh.querySelector('#m-x').onclick=chiudiModal;
     if(!nuovo) sh.querySelector('#m-del').onclick=async()=>{
       if(!confirm('Eliminare "'+f.nome+'"?\n\nGli ordini già fatti restano invariati.')) return;
       await sb.from('ord_fornitori').update({attivo:false}).eq('id',f.id);
       await caricaFornitori(); chiudiModal(); vistaFornitori(); toast('Fornitore eliminato');
     };
     sh.querySelector('#m-ok').onclick=async()=>{
       const rec={ nome:sh.querySelector('#f-nome').value.trim(), email:sh.querySelector('#f-mail').value.trim()||null,
                   telefono:sh.querySelector('#f-tel').value.trim()||null, note:sh.querySelector('#f-note').value.trim()||null };
       if(!rec.nome){ alert('Il nome è obbligatorio.'); return; }
       const { error } = f.id ? await sb.from('ord_fornitori').update(rec).eq('id',f.id) : await sb.from('ord_fornitori').insert(rec);
       if(error){ alert(error.code==='23505'?'Questo fornitore esiste già.':'Errore: '+error.message); return; }
       await caricaFornitori(); chiudiModal(); vistaFornitori(); toast('Fornitore salvato');
     };
   });
}

/* ---------------- MODALE + TOAST ---------------- */
function modal(titolo, html, init){
  const root=$('#modal-root');
  root.innerHTML=`<div class="ov"><div class="sheet"><h2>${esc(titolo)}</h2><div style="height:10px"></div>${html}</div></div>`;
  root.querySelector('.ov').onclick=e=>{ if(e.target.classList.contains('ov')) chiudiModal(); };
  if(init) init(root.querySelector('.sheet'));
}
function chiudiModal(){ $('#modal-root').innerHTML=''; }
function toast(t){
  const d=document.createElement('div'); d.textContent=t;
  d.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:70;font-size:14px;box-shadow:0 6px 20px #16202b40';
  document.body.appendChild(d); setTimeout(()=>d.remove(),1800);
}
</script>
