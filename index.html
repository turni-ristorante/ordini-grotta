<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ordini · Grotta Marcello</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#16202b; --ink-2:#31404f; --mut:#7b8a99;
  --paper:#f4f2ed; --card:#ffffff; --line:#dfdcd4;
  --acc:#0b6b5b;        /* verde bottiglia: azione */
  --acc-soft:#e3f0ec;
  --ord:#1f6fb2;        /* ordinato */
  --con:#0b6b5b;        /* consegnato */
  --warn:#c0392b;       /* senza prezzo / mancante */
  --warn-soft:#fbeceb;
  --amb:#b4700a; --amb-soft:#fdf1dc;
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;padding-bottom:96px}
h1,h2,h3,.dsp{font-family:Archivo,system-ui,sans-serif;letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hide{display:none!important}

/* ---------- chrome ---------- */
header{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;padding:10px 14px calc(10px + env(safe-area-inset-top)) 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:10px}
.htitle{font-family:Archivo;font-weight:700;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsub{font-size:12px;color:#9fb0be;margin-top:2px}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#ffffff1a;color:#fff;font-size:16px;flex:none}
.iconbtn:active{background:#ffffff33}
.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 13px;border-radius:999px;background:#ffffff14;color:#c9d5de;font-size:13px;font-weight:500;white-space:nowrap}
.tab.on{background:#fff;color:var(--ink);font-weight:600}
main{padding:14px;max-width:900px;margin:0 auto}

/* ---------- generic ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.btn{background:var(--acc);color:#fff;padding:11px 16px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--warn)}
.btn:disabled{opacity:.45}
.btn.full{width:100%}
.inp{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}
.inp:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:var(--acc)}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.muted{color:var(--mut);font-size:12.5px}
.empty{text-align:center;color:var(--mut);padding:40px 20px}
.chipbar{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.chipbar::-webkit-scrollbar{display:none}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.02em}
.b-open{background:var(--amb-soft);color:var(--amb)}
.b-ord{background:#e6f0f8;color:var(--ord)}
.b-clo{background:var(--acc-soft);color:var(--acc)}
.b-warn{background:var(--warn-soft);color:var(--warn)}

/* ---------- riga articolo ---------- */
.art{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;margin-bottom:8px}
.art.filled{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.art.noprice{border-color:var(--warn);background:var(--warn-soft)}
.art-top{display:flex;gap:10px;align-items:flex-start}
.art-nm{flex:1;font-weight:600;line-height:1.3}
.art-meta{font-size:12px;color:var(--mut);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px}
.art-meta b{font-weight:600;color:var(--ink-2)}
.qty{display:flex;gap:6px;flex:none;align-items:center}
.qty input{width:66px;padding:9px 8px;border:1.5px solid var(--line);border-radius:9px;text-align:center;font-weight:700;font-size:16px;background:#fff}
.qty input.has{border-color:var(--acc);background:var(--acc-soft)}
.qty select{padding:9px 4px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13px}
.art-listino{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 12px}
.flags{display:flex;gap:8px;margin-top:9px}
.flag{flex:1;padding:9px;border:1.5px solid var(--line);border-radius:9px;background:#fff;font-size:13px;font-weight:600;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:6px}
.flag.on-ord{border-color:var(--ord);background:#e6f0f8;color:var(--ord)}
.flag.on-con{border-color:var(--con);background:var(--acc-soft);color:var(--con)}
.notebox{margin-top:8px}
.notebox input{width:100%;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;font-size:13px;background:#fcfbf9}

/* ---------- barra salva ---------- */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
.savebar .cnt{flex:1;font-size:13px;color:var(--mut)}
.savebar .cnt b{color:var(--warn)}

/* ---------- modale ---------- */
.ov{position:fixed;inset:0;z-index:60;background:#16202bcc;display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{font-size:19px;margin-bottom:4px}
.rep-item{background:#fff;border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:9px 11px;margin-bottom:6px;font-size:14px}
.rep-item .m{font-size:12px;color:var(--mut)}
@media(min-width:700px){ .ov{align-items:center;padding:20px} .sheet{border-radius:16px} }
</style>
</head>
<body>

<!-- =================== LOGIN =================== -->
<div id="v-login">
  <main style="padding-top:60px;max-width:380px">
    <h1 class="dsp" style="font-size:26px">Ordini</h1>
    <p class="muted" style="margin:6px 0 24px">Grotta Marcello</p>
    <div class="card">
      <label class="f"><span>Codice personale</span>
        <input class="inp" id="in-code" type="tel" inputmode="numeric" autocomplete="off" placeholder="es. 2001">
      </label>
      <button class="btn full" id="btn-login">Entra</button>
      <p id="login-err" class="muted hide" style="color:var(--warn);margin:10px 0 0"></p>
    </div>
  </main>
</div>

<!-- =================== APP =================== -->
<div id="v-app" class="hide">
  <header>
    <div class="hrow">
      <button class="iconbtn hide" id="btn-back">←</button>
      <div style="flex:1;min-width:0">
        <div class="htitle" id="h-title">Ordini</div>
        <div class="hsub" id="h-sub"></div>
      </div>
      <button class="iconbtn" id="btn-menu">⋯</button>
    </div>
    <div class="tabs" id="sector-tabs"></div>
  </header>
  <main id="main"></main>
</div>

<div class="savebar hide" id="savebar">
  <div class="cnt" id="save-cnt"></div>
  <button class="btn" id="btn-save">💾 Salva</button>
</div>

<div id="modal-root"></div>

<script>
/* ============================================================
   CONFIGURAZIONE  —  incolla qui i dati del tuo progetto Supabase
   ============================================================ */
const SUPABASE_URL = 'https://otxmmlkyoxndcdybtufy.supabase.co/rest/v1/';
const SUPABASE_ANON_KEY = 'sb_publishable_HQpyom62MSKjBmTa_bisUw_a2m6RE5l';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const SETTORI = {
  cucina:    { nome:'Cucina e pizzeria', liste:['Cucina e pizzeria'] },
  sala_vini: { nome:'Sala e vini',       liste:['Vini','Sala'] },
  bar:       { nome:'Bar',               liste:['Bar'] }
};
const UM = ['Pz','Kg','Co','Ct','Lt','g','ml','Mazzo'];

const S = {              // stato applicativo
  user:null, view:'ordini', settore:null, lista:null,
  ordini:[], ordine:null, articoli:[], righe:{}, dirty:new Set(),
  q:'', filtro:null, soloQta:false, alertVisto:false
};
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const oggi = () => new Date().toISOString().slice(0,10);
const dataIT = d => { const [a,m,g]=d.split('-'); return `${g}/${m}/${a}`; };
const isResp = () => S.user?.ruolo === 'responsabile';

/* ---------------- LOGIN ---------------- */
$('#btn-login').onclick = async () => {
  const cod = $('#in-code').value.trim();
  if(!cod) return;
  const { data, error } = await sb.from('ord_utenti').select('*').eq('codice',cod).eq('attivo',true).maybeSingle();
  if(error || !data){ const e=$('#login-err'); e.textContent='Codice non riconosciuto. Riprova.'; e.classList.remove('hide'); return; }
  S.user = data;
  localStorage.setItem('gm_ordini_code', cod);
  $('#v-login').classList.add('hide'); $('#v-app').classList.remove('hide');
  S.settore = data.settori[0] || 'cucina';
  await caricaArticoli();
  await vistaOrdini();
};
$('#in-code').addEventListener('keydown', e => { if(e.key==='Enter') $('#btn-login').click(); });

window.addEventListener('load', async () => {
  const cod = localStorage.getItem('gm_ordini_code');
  if(cod){ $('#in-code').value = cod; $('#btn-login').click(); }
});

/* ---------------- DATI ---------------- */
async function caricaArticoli(){
  const { data } = await sb.from('ord_articoli').select('*').order('settore').order('lista').order('seq');
  S.articoli = data || [];
}
async function caricaOrdini(){
  const { data } = await sb.from('ord_ordini').select('*').order('data',{ascending:false});
  S.ordini = data || [];
}

/* ---------------- NAV ---------------- */
$('#btn-back').onclick = () => { if(confermaUscita()) vistaOrdini(); };
$('#btn-menu').onclick = () => menu();

function confermaUscita(){
  if(S.dirty.size && !confirm('Ci sono '+S.dirty.size+' modifiche non salvate. Uscire comunque?')) return false;
  S.dirty.clear(); return true;
}
function menu(){
  const v = [
    ['ordini','📋 Ordini'],
    ['anagrafica','📖 Anagrafica articoli'],
    isResp() ? ['utenti','👥 Utenti e accessi'] : null,
    ['logout','🚪 Esci']
  ].filter(Boolean);
  modal('Menu', v.map(([k,l])=>`<button class="btn ghost full" style="margin-bottom:8px" data-go="${k}">${l}</button>`).join(''), sheet=>{
    sheet.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
      chiudiModal();
      if(b.dataset.go==='logout'){ localStorage.removeItem('gm_ordini_code'); location.reload(); return; }
      if(!confermaUscita()) return;
      if(b.dataset.go==='ordini') vistaOrdini();
      if(b.dataset.go==='anagrafica') vistaAnagrafica();
      if(b.dataset.go==='utenti') vistaUtenti();
    });
  });
}

function tabsSettori(onclick){
  const t = $('#sector-tabs');
  const mie = S.user.settori;
  if(mie.length<2 && !(S.settore==='sala_vini')){ t.innerHTML=''; return; }
  let html = mie.map(s=>`<button class="tab ${S.settore===s?'on':''}" data-s="${s}">${SETTORI[s].nome}</button>`).join('');
  if(S.settore==='sala_vini' && onclick){
    html += SETTORI.sala_vini.liste.map(l=>`<button class="tab ${S.lista===l?'on':''}" data-l="${l}">${l}</button>`).join('');
  }
  t.innerHTML = html;
  if(!onclick){ t.innerHTML=''; return; }
  t.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ S.settore=b.dataset.s; S.lista=null; S.filtro=null; onclick(); });
  t.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{ S.lista = S.lista===b.dataset.l ? null : b.dataset.l; S.filtro=null; onclick(); });
}

/* ============================================================
   VISTA 1 — ELENCO ORDINI
   ============================================================ */
async function vistaOrdini(){
  S.view='ordini'; S.ordine=null; S.righe={}; S.dirty.clear(); S.alertVisto=false;
  $('#btn-back').classList.add('hide'); $('#savebar').classList.add('hide');
  $('#h-title').textContent='Ordini';
  $('#h-sub').textContent = S.user.nome + (isResp()?' · responsabile ordini':'');
  $('#sector-tabs').innerHTML='';
  $('#main').innerHTML = '<p class="muted">Carico…</p>';
  await caricaOrdini();

  const nuovo = isResp() ? `
    <div class="card">
      <label class="f"><span>Nuovo ordine — data</span>
        <input class="inp" type="date" id="new-date" value="${oggi()}"></label>
      <button class="btn full" id="btn-new">＋ Crea ordine</button>
    </div>` : '';

  const lista = S.ordini.length ? S.ordini.map(o=>{
    const b = o.stato==='chiuso' ? '<span class="badge b-clo">Chiuso</span>'
            : o.stato==='ordini_chiusi' ? '<span class="badge b-ord">Ordini chiusi</span>'
            : '<span class="badge b-open">Aperto</span>';
    return `<div class="card" data-o="${o.id}" style="cursor:pointer;display:flex;align-items:center;gap:10px">
      <div style="flex:1">
        <div class="dsp" style="font-size:17px;font-weight:600">${dataIT(o.data)}</div>
        <div class="muted">${esc(o.etichetta||'')}</div>
      </div>${b}<span class="muted">›</span></div>`;
  }).join('') : '<div class="empty">Nessun ordine. Il responsabile ne crea uno scegliendo la data.</div>';

  $('#main').innerHTML = nuovo + lista;
  if(isResp()) $('#btn-new').onclick = async () => {
    const d = $('#new-date').value; if(!d) return;
    const { data, error } = await sb.from('ord_ordini').insert({ data:d }).select().single();
    if(error){ alert('Errore: '+error.message); return; }
    apriOrdine(data);
  };
  $('#main').querySelectorAll('[data-o]').forEach(c=>c.onclick=()=>apriOrdine(S.ordini.find(o=>o.id==c.dataset.o)));
}

/* ============================================================
   VISTA 2 — DETTAGLIO ORDINE
   ============================================================ */
async function apriOrdine(o){
  S.ordine=o; S.view='ordine'; S.dirty.clear(); S.righe={}; S.q=''; S.filtro=null; S.soloQta=false;
  const { data } = await sb.from('ord_righe').select('*').eq('ordine_id',o.id);
  (data||[]).forEach(r=>{ if(r.articolo_id) S.righe[r.articolo_id]=r; });
  $('#btn-back').classList.remove('hide');
  renderOrdine();
  if(isResp() && !S.alertVisto) alertPrezzi();
}

function riga(a){
  return S.righe[a.id] || (S.righe[a.id] = {
    ordine_id:S.ordine.id, articolo_id:a.id, nome_snapshot:a.nome, settore:a.settore, lista:a.lista,
    quantita:null, qta_um:a.um||'Pz', ordinato:false, consegnato:false, note_riga:null, operatore:S.user.nome
  });
}

function articoliVisibili(){
  return S.articoli.filter(a=>{
    if(a.settore!==S.settore) return false;
    if(!a.attivo && !(S.righe[a.id]?.quantita>0)) return false;
    if(S.lista && a.lista!==S.lista) return false;
    if(S.filtro && (a.categoria||a.posizione)!==S.filtro && a.categoria!==S.filtro && a.posizione!==S.filtro) return false;
    if(S.soloQta && !(S.righe[a.id]?.quantita>0)) return false;
    if(S.q){
      const t=(a.nome+' '+(a.categoria||'')+' '+(a.posizione||'')+' '+(a.produttore||'')+' '+(a.venditore_primario||'')).toLowerCase();
      if(!t.includes(S.q.toLowerCase())) return false;
    }
    return true;
  });
}

function renderOrdine(){
  const o=S.ordine;
  $('#h-title').textContent = 'Ordine ' + dataIT(o.data);
  $('#h-sub').textContent = (o.stato==='chiuso'?'Chiuso':o.stato==='ordini_chiusi'?'Ordini chiusi · scarichi in corso':'Aperto') + ' · ' + S.user.nome;
  tabsSettori(renderOrdine);

  const art = articoliVisibili();
  const gruppi = [...new Set(S.articoli.filter(a=>a.settore===S.settore && a.attivo && (!S.lista||a.lista===S.lista)).map(a=>a.categoria).filter(Boolean))].sort();

  const azioni = isResp() ? `
    <div class="card" style="display:flex;gap:8px">
      <button class="btn ghost" style="flex:1" id="btn-fo">✓ Fine ordini</button>
      <button class="btn ghost" style="flex:1" id="btn-fs">📦 Fine scarichi</button>
    </div>` : '';

  $('#main').innerHTML = `
    ${azioni}
    <input class="inp" id="q" placeholder="🔍 Cerca articolo…" value="${esc(S.q)}" style="margin-bottom:10px">
    <div class="chipbar">
      <button class="chip ${!S.filtro&&!S.soloQta?'on':''}" data-f="">Tutti (${art.length})</button>
      <button class="chip ${S.soloQta?'on':''}" data-f="__qta">Solo richiesti</button>
      ${gruppi.map(g=>`<button class="chip ${S.filtro===g?'on':''}" data-f="${esc(g)}">${esc(g)}</button>`).join('')}
    </div>
    <div id="list">${art.map(cardArticolo).join('') || '<div class="empty">Nessun articolo con questi filtri.</div>'}</div>`;

  $('#q').oninput = e => { S.q=e.target.value; const l=$('#list'); l.innerHTML = articoliVisibili().map(cardArticolo).join('')||'<div class="empty">Nessun risultato.</div>'; bindRighe(); };
  $('#main').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{
    const f=b.dataset.f;
    if(f==='__qta'){ S.soloQta=!S.soloQta; S.filtro=null; }
    else { S.filtro = f||null; S.soloQta=false; }
    renderOrdine();
  });
  if(isResp()){ $('#btn-fo').onclick=fineOrdini; $('#btn-fs').onclick=fineScarichi; }
  bindRighe();
  aggiornaSaveBar();
}

function cardArticolo(a){
  const r = S.righe[a.id] || {};
  const noPrice = isResp() && (a.prezzo===null || a.prezzo===undefined);
  const has = r.quantita>0;
  const meta = [
    a.posizione && `<b>${esc(a.posizione)}</b>`,
    a.categoria && esc(a.categoria),
    a.annata && 'Annata '+esc(a.annata),
    a.produttore && esc(a.produttore),
    a.minimo_ordine && 'min '+esc(a.minimo_ordine),
    a.anticipo && 'anticipo '+esc(a.anticipo),
    !a.attivo && '<span class="badge b-warn">eliminato</span>'
  ].filter(Boolean).join(' · ');
  const listino = isResp() ? `<div class="art-listino">
      ${noPrice ? '<span class="badge b-warn">⚠ senza prezzo</span>'
                : `<span>💶 <b>${a.prezzo.toLocaleString('it-IT',{minimumFractionDigits:2})} €</b>${a.prezzo_um?'/'+esc(a.prezzo_um):''}</span>`}
      ${a.venditore_primario?`<span>🏷 ${esc(a.venditore_primario)}</span>`:''}
      ${a.venditore_alternativo?`<span class="muted">alt. ${esc(a.venditore_alternativo)}</span>`:''}
      ${a.codice?`<span class="muted">cod. ${esc(a.codice)}</span>`:''}
      ${a.tipo_consegna?`<span class="muted">${esc(a.tipo_consegna)}</span>`:''}
    </div>` : '';
  const flags = isResp() ? `<div class="flags">
      <button class="flag ${r.ordinato?'on-ord':''}" data-flag="ordinato" data-id="${a.id}">${r.ordinato?'✓':'○'} Ordinato</button>
      <button class="flag ${r.consegnato?'on-con':''}" data-flag="consegnato" data-id="${a.id}">${r.consegnato?'✓':'○'} Consegnato</button>
    </div>` : '';
  return `<div class="art ${has?'filled':''} ${noPrice?'noprice':''}" id="art-${a.id}">
    <div class="art-top">
      <div style="flex:1;min-width:0">
        <div class="art-nm">${esc(a.nome)}</div>
        <div class="art-meta">${meta}</div>
      </div>
      <div class="qty">
        <input type="number" inputmode="decimal" step="any" min="0" placeholder="0"
               value="${r.quantita??''}" class="${has?'has':''}" data-qta="${a.id}">
        <select data-um="${a.id}">${UM.map(u=>`<option ${(r.qta_um||a.um)===u?'selected':''}>${u}</option>`).join('')}</select>
      </div>
    </div>
    ${a.note?`<div class="muted" style="margin-top:6px">📝 ${esc(a.note)}</div>`:''}
    ${listino}
    ${flags}
    <div class="notebox"><input placeholder="Nota per questo ordine…" value="${esc(r.note_riga||'')}" data-note="${a.id}"></div>
  </div>`;
}

function bindRighe(){
  $('#main').querySelectorAll('[data-qta]').forEach(i=>i.onchange=e=>{
    const a=S.articoli.find(x=>x.id==i.dataset.qta), r=riga(a);
    const v=e.target.value===''?null:parseFloat(e.target.value);
    r.quantita = (v===null||isNaN(v))?null:v; r.operatore=S.user.nome;
    e.target.classList.toggle('has', r.quantita>0);
    document.getElementById('art-'+a.id).classList.toggle('filled', r.quantita>0);
    S.dirty.add(a.id); aggiornaSaveBar();
  });
  $('#main').querySelectorAll('[data-um]').forEach(s=>s.onchange=e=>{
    const a=S.articoli.find(x=>x.id==s.dataset.um); riga(a).qta_um=e.target.value; S.dirty.add(a.id); aggiornaSaveBar();
  });
  $('#main').querySelectorAll('[data-note]').forEach(i=>i.onchange=e=>{
    const a=S.articoli.find(x=>x.id==i.dataset.note); riga(a).note_riga=e.target.value||null; S.dirty.add(a.id); aggiornaSaveBar();
  });
  $('#main').querySelectorAll('[data-flag]').forEach(b=>b.onclick=()=>{
    const a=S.articoli.find(x=>x.id==b.dataset.id), r=riga(a), f=b.dataset.flag;
    r[f]=!r[f];
    if(f==='ordinato'){ r.ordinato_il = r.ordinato?new Date().toISOString():null; if(!r.ordinato){ r.consegnato=false; r.consegnato_il=null; } }
    if(f==='consegnato'){ r.consegnato_il = r.consegnato?new Date().toISOString():null; }
    S.dirty.add(a.id);
    const p=b.parentElement;
    p.querySelector('[data-flag="ordinato"]').className='flag '+(r.ordinato?'on-ord':'');
    p.querySelector('[data-flag="ordinato"]').textContent=(r.ordinato?'✓':'○')+' Ordinato';
    p.querySelector('[data-flag="consegnato"]').className='flag '+(r.consegnato?'on-con':'');
    p.querySelector('[data-flag="consegnato"]').textContent=(r.consegnato?'✓':'○')+' Consegnato';
    aggiornaSaveBar();
  });
}

function aggiornaSaveBar(){
  const b=$('#savebar');
  if(S.view!=='ordine'){ b.classList.add('hide'); return; }
  b.classList.remove('hide');
  $('#save-cnt').innerHTML = S.dirty.size ? `<b>${S.dirty.size}</b> modifiche da salvare` : 'Tutto salvato';
  $('#btn-save').disabled = !S.dirty.size;
}

$('#btn-save').onclick = async () => {
  const btn=$('#btn-save'); btn.disabled=true; btn.textContent='Salvo…';
  const up=[], del=[];
  for(const id of S.dirty){
    const r=S.righe[id];
    const vuota = !(r.quantita>0) && !r.ordinato && !r.consegnato && !r.note_riga;
    if(vuota && r.id) del.push(r.id);
    else if(!vuota) up.push({
      id:r.id, ordine_id:r.ordine_id, articolo_id:r.articolo_id, nome_snapshot:r.nome_snapshot,
      settore:r.settore, lista:r.lista, quantita:r.quantita, qta_um:r.qta_um,
      ordinato:r.ordinato, ordinato_il:r.ordinato_il||null, consegnato:r.consegnato, consegnato_il:r.consegnato_il||null,
      note_riga:r.note_riga, operatore:r.operatore, aggiornato_il:new Date().toISOString()
    });
  }
  let err=null;
  if(del.length){ const {error}=await sb.from('ord_righe').delete().in('id',del); if(error) err=error; del.forEach(id=>{ const k=Object.keys(S.righe).find(k=>S.righe[k].id===id); if(k) delete S.righe[k]; }); }
  if(up.length){
    const rows = up.map(r=>{ const c={...r}; if(!c.id) delete c.id; return c; });
    const { data, error } = await sb.from('ord_righe').upsert(rows,{onConflict:'ordine_id,articolo_id'}).select();
    if(error) err=error; else (data||[]).forEach(r=>{ S.righe[r.articolo_id]=r; });
  }
  btn.textContent='💾 Salva';
  if(err){ alert('Errore nel salvataggio: '+err.message); btn.disabled=false; return; }
  S.dirty.clear(); aggiornaSaveBar(); toast('Salvato');
};

/* ---------------- ALERT PREZZI ---------------- */
function alertPrezzi(){
  S.alertVisto=true;
  const senza = S.articoli.filter(a=>a.attivo && (a.prezzo===null||a.prezzo===undefined));
  if(!senza.length) return;
  const perSettore = {};
  senza.forEach(a=>{ const k=SETTORI[a.settore]?.nome||a.settore; perSettore[k]=(perSettore[k]||0)+1; });
  modal('⚠ Articoli senza prezzo',
    `<p>Ci sono <b>${senza.length} articoli</b> senza prezzo a listino. Nell'elenco sono evidenziati in rosso.</p>
     <div class="card">${Object.entries(perSettore).map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:4px 0"><span>${k}</span><b>${v}</b></div>`).join('')}</div>
     <button class="btn full" id="m-ok">Ho capito</button>`,
    sh=>{ sh.querySelector('#m-ok').onclick=chiudiModal; });
}

/* ---------------- FINE ORDINI / FINE SCARICHI ---------------- */
async function ricaricaRighe(){
  const { data } = await sb.from('ord_righe').select('*').eq('ordine_id',S.ordine.id);
  S.righe={}; (data||[]).forEach(r=>{ if(r.articolo_id) S.righe[r.articolo_id]=r; });
}
function nomeSettore(s){ return SETTORI[s]?.nome||s; }

async function fineOrdini(){
  if(S.dirty.size){ alert('Salva prima le modifiche in sospeso.'); return; }
  await ricaricaRighe();
  const mancanti = Object.values(S.righe).filter(r=>r.quantita>0 && !r.ordinato);
  const tot = Object.values(S.righe).filter(r=>r.quantita>0).length;
  const rep = { generato_il:new Date().toISOString(), da:S.user.nome, totale_richiesti:tot,
                non_ordinati:mancanti.map(r=>({nome:r.nome_snapshot,q:r.quantita,um:r.qta_um,settore:r.settore})) };
  modal('Fine ordini · ' + dataIT(S.ordine.data),
    `<p class="muted" style="margin:0 0 12px">${tot} articoli richiesti · <b style="color:${mancanti.length?'var(--warn)':'var(--acc)'}">${mancanti.length} non ordinati</b></p>
     ${mancanti.length ? mancanti.map(r=>`<div class="rep-item"><b>${esc(r.nome_snapshot)}</b> — ${r.quantita} ${esc(r.qta_um||'')}<div class="m">${nomeSettore(r.settore)}</div></div>`).join('')
                       : '<div class="card" style="text-align:center;color:var(--acc)"><b>Tutto ordinato.</b> Nessun articolo rimasto indietro.</div>'}
     <div style="display:flex;gap:8px;margin-top:14px">
       <button class="btn ghost" style="flex:1" id="m-x">Chiudi</button>
       <button class="btn" style="flex:1" id="m-ok">Conferma fine ordini</button>
     </div>`,
    sh=>{
      sh.querySelector('#m-x').onclick=chiudiModal;
      sh.querySelector('#m-ok').onclick=async()=>{
        await sb.from('ord_ordini').update({stato:'ordini_chiusi', chiuso_ordini_il:new Date().toISOString(), report_ordini:rep}).eq('id',S.ordine.id);
        S.ordine.stato='ordini_chiusi'; S.ordine.report_ordini=rep;
        chiudiModal(); renderOrdine(); toast('Ordini chiusi');
      };
    });
}

async function fineScarichi(){
  if(S.dirty.size){ alert('Salva prima le modifiche in sospeso.'); return; }
  await ricaricaRighe();
  const mancanti = Object.values(S.righe).filter(r=>r.ordinato && !r.consegnato);
  const nonOrd  = Object.values(S.righe).filter(r=>r.quantita>0 && !r.ordinato);
  const tot = Object.values(S.righe).filter(r=>r.ordinato).length;
  const rep = { generato_il:new Date().toISOString(), da:S.user.nome, totale_ordinati:tot,
                non_consegnati:mancanti.map(r=>({nome:r.nome_snapshot,q:r.quantita,um:r.qta_um,settore:r.settore})),
                mai_ordinati:nonOrd.map(r=>({nome:r.nome_snapshot,q:r.quantita,um:r.qta_um,settore:r.settore})) };
  modal('Fine scarichi · ' + dataIT(S.ordine.data),
    `<p class="muted" style="margin:0 0 12px">${tot} articoli ordinati · <b style="color:${mancanti.length?'var(--warn)':'var(--acc)'}">${mancanti.length} non consegnati</b></p>
     ${mancanti.length ? mancanti.map(r=>`<div class="rep-item"><b>${esc(r.nome_snapshot)}</b> — ${r.quantita} ${esc(r.qta_um||'')}<div class="m">${nomeSettore(r.settore)}</div></div>`).join('')
                       : '<div class="card" style="text-align:center;color:var(--acc)"><b>Tutto consegnato.</b></div>'}
     ${nonOrd.length ? `<h3 style="margin:16px 0 8px;font-size:14px">Richiesti ma mai ordinati (${nonOrd.length})</h3>`
        + nonOrd.map(r=>`<div class="rep-item"><b>${esc(r.nome_snapshot)}</b> — ${r.quantita} ${esc(r.qta_um||'')}<div class="m">${nomeSettore(r.settore)}</div></div>`).join('') : ''}
     <div style="display:flex;gap:8px;margin-top:14px">
       <button class="btn ghost" style="flex:1" id="m-x">Chiudi</button>
       <button class="btn" style="flex:1" id="m-ok">Conferma fine scarichi</button>
     </div>`,
    sh=>{
      sh.querySelector('#m-x').onclick=chiudiModal;
      sh.querySelector('#m-ok').onclick=async()=>{
        await sb.from('ord_ordini').update({stato:'chiuso', chiuso_scarichi_il:new Date().toISOString(), report_scarichi:rep}).eq('id',S.ordine.id);
        S.ordine.stato='chiuso'; S.ordine.report_scarichi=rep;
        chiudiModal(); renderOrdine(); toast('Scarichi chiusi');
      };
    });
}

/* ============================================================
   VISTA 3 — ANAGRAFICA (tutti i campi modificabili)
   ============================================================ */
function vistaAnagrafica(){
  S.view='anagrafica'; S.q=''; $('#savebar').classList.add('hide');
  $('#btn-back').classList.remove('hide');
  $('#h-title').textContent='Anagrafica articoli';
  $('#h-sub').textContent = isResp()?'Tutti i campi modificabili':'Solo consultazione dei tuoi settori';
  tabsSettori(vistaAnagrafica);
  render();
  function render(){
    const art = S.articoli.filter(a=>a.settore===S.settore && (!S.lista||a.lista===S.lista)
      && (!S.q || a.nome.toLowerCase().includes(S.q.toLowerCase())));
    $('#main').innerHTML = `
      ${isResp()?'<button class="btn full" id="btn-add" style="margin-bottom:10px">＋ Nuovo articolo</button>':''}
      <input class="inp" id="q" placeholder="🔍 Cerca…" value="${esc(S.q)}" style="margin-bottom:10px">
      ${art.map(a=>`<div class="art ${!a.attivo?'noprice':''}" data-a="${a.id}" style="cursor:pointer">
        <div class="art-top"><div style="flex:1">
          <div class="art-nm">${esc(a.nome)} ${!a.attivo?'<span class="badge b-warn">eliminato</span>':''}</div>
          <div class="art-meta">${[a.posizione,a.categoria,a.um,a.prezzo!=null?a.prezzo.toFixed(2)+' €':'<span class="badge b-warn">senza prezzo</span>'].filter(Boolean).join(' · ')}</div>
        </div><span class="muted">›</span></div></div>`).join('') || '<div class="empty">Nessun articolo.</div>'}`;
    $('#q').oninput=e=>{ S.q=e.target.value; render(); };
    if(isResp()) $('#btn-add').onclick=()=>schedaArticolo(null,render);
    $('#main').querySelectorAll('[data-a]').forEach(c=>c.onclick=()=>schedaArticolo(S.articoli.find(a=>a.id==c.dataset.a),render));
  }
}

function schedaArticolo(a, done){
  const nuovo = !a;
  a = a || { settore:S.settore, lista:S.lista||SETTORI[S.settore].liste[0], attivo:true, seq:999 };
  const ro = !isResp();     // gli operatori consultano; solo il responsabile modifica
  const F = (k,l,t='text') => `<label class="f"><span>${l}</span><input class="inp" data-k="${k}" type="${t}" value="${esc(a[k]??'')}" ${ro?'disabled':''}></label>`;
  const listino = `
    <h3 style="margin:16px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)">Listino — visibile solo al responsabile</h3>
    <div class="grid2">${F('prezzo','Prezzo €','number')}${F('prezzo_um','Prezzo per (U.M.)')}</div>
    <div class="grid2">${F('venditore_primario','Venditore primario')}${F('venditore_alternativo','Venditore alternativo')}</div>
    <div class="grid2">${F('codice','Codice')}${F('tipo_consegna','Tipo consegna')}</div>
    <div class="grid2">${F('cod_vendita','Cod. vendita')}${F('annata','Annata')}</div>
    ${F('produttore','Produttore')}
    <div class="grid2">${F('uso1','Settore utilizzo 1')}${F('uso2','Settore utilizzo 2')}</div>
    ${F('uso3','Settore utilizzo 3')}`;
  modal(nuovo?'Nuovo articolo':'Scheda articolo', `
    ${F('nome','Nome articolo')}
    <div class="grid2">
      <label class="f"><span>Settore</span><select class="inp" data-k="settore" ${ro?'disabled':''}>
        ${Object.entries(SETTORI).map(([k,v])=>`<option value="${k}" ${a.settore===k?'selected':''}>${v.nome}</option>`).join('')}</select></label>
      <label class="f"><span>Lista</span><select class="inp" data-k="lista" ${ro?'disabled':''}>
        ${['Cucina e pizzeria','Vini','Sala','Bar'].map(l=>`<option ${a.lista===l?'selected':''}>${l}</option>`).join('')}</select></label>
    </div>
    <div class="grid2">${F('categoria','Settore merceologico')}${F('posizione','Posizione / ubicazione')}</div>
    <div class="grid2">${F('um','U.M.')}${F('minimo_ordine','Minimo ordine')}</div>
    <div class="grid2">${F('anticipo','Anticipo ordine (1x1…)')}${F('seq','Ordine in lista','number')}</div>
    <label class="f"><span>Note</span><textarea class="inp" rows="2" data-k="note" ${ro?'disabled':''}>${esc(a.note??'')}</textarea></label>
    ${isResp()?listino:''}
    ${isResp()?`<div style="display:flex;gap:8px;margin-top:14px">
      ${!nuovo?`<button class="btn warn" id="m-del">🗑 Elimina</button>`:''}
      <button class="btn ghost" style="flex:1" id="m-x">Annulla</button>
      <button class="btn" style="flex:1" id="m-ok">💾 Salva</button></div>`
     :`<button class="btn ghost full" id="m-x">Chiudi</button>`}`,
   sh=>{
     sh.querySelector('#m-x').onclick=chiudiModal;
     if(!isResp()) return;
     if(!nuovo) sh.querySelector('#m-del').onclick=async()=>{
       if(!confirm('Eliminare "'+a.nome+'"?\n\nSparirà dagli ordini futuri, ma resterà intatto in tutti gli ordini già fatti.')) return;
       await sb.from('ord_articoli').update({attivo:false}).eq('id',a.id);
       await caricaArticoli(); chiudiModal(); done(); toast('Articolo eliminato');
     };
     sh.querySelector('#m-ok').onclick=async()=>{
       const rec={...a};
       sh.querySelectorAll('[data-k]').forEach(i=>{
         let v=i.value.trim?i.value.trim():i.value;
         if(i.type==='number') v = v===''?null:parseFloat(v);
         rec[i.dataset.k] = v===''?null:v;
       });
       if(!rec.nome){ alert('Il nome è obbligatorio.'); return; }
       rec.aggiornato_il=new Date().toISOString();
       delete rec.creato_il;
       const { error } = rec.id ? await sb.from('ord_articoli').update(rec).eq('id',rec.id)
                                : await sb.from('ord_articoli').insert(rec);
       if(error){ alert('Errore: '+error.message); return; }
       await caricaArticoli(); chiudiModal(); done(); toast('Articolo salvato');
     };
   });
}

async function vistaUtenti(){
  S.view='utenti'; $('#savebar').classList.add('hide');
  $('#btn-back').classList.remove('hide');
  $('#h-title').textContent='Utenti e accessi'; $('#h-sub').textContent='Chi vede cosa';
  $('#sector-tabs').innerHTML='';
  const { data } = await sb.from('ord_utenti').select('*').order('id');
  $('#main').innerHTML = `<button class="btn full" id="btn-addu" style="margin-bottom:10px">＋ Nuovo utente</button>` +
    (data||[]).map(u=>`<div class="card" data-u="${u.id}" style="cursor:pointer">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="flex:1">
          <div style="font-weight:600">${esc(u.nome)} ${!u.attivo?'<span class="badge b-warn">disattivato</span>':''}</div>
          <div class="muted">codice ${esc(u.codice)} · ${u.ruolo==='responsabile'?'responsabile ordini':'operatore'} · ${u.settori.map(nomeSettore).join(', ')||'nessun settore'}</div>
        </div><span class="muted">›</span></div></div>`).join('');
  $('#btn-addu').onclick=()=>schedaUtente(null);
  $('#main').querySelectorAll('[data-u]').forEach(c=>c.onclick=()=>schedaUtente((data||[]).find(u=>u.id==c.dataset.u)));
}

function schedaUtente(u){
  const nuovo=!u;
  u = u || { nome:'', codice:'', ruolo:'operatore', settori:[], attivo:true };
  modal(nuovo?'Nuovo utente':'Scheda utente', `
    <label class="f"><span>Nome</span><input class="inp" id="u-nome" value="${esc(u.nome)}"></label>
    <label class="f"><span>Codice personale</span><input class="inp" id="u-cod" value="${esc(u.codice)}"></label>
    <label class="f"><span>Ruolo</span><select class="inp" id="u-ruolo">
      <option value="operatore" ${u.ruolo==='operatore'?'selected':''}>Operatore</option>
      <option value="responsabile" ${u.ruolo==='responsabile'?'selected':''}>Responsabile ordini</option></select></label>
    <label class="f"><span>Settori visibili</span>
      <div class="chipbar" id="u-set">${Object.entries(SETTORI).map(([k,v])=>
        `<button class="chip ${u.settori.includes(k)?'on':''}" data-s="${k}">${v.nome}</button>`).join('')}</div></label>
    <label class="f"><span>Stato</span><select class="inp" id="u-att">
      <option value="1" ${u.attivo?'selected':''}>Attivo</option>
      <option value="0" ${!u.attivo?'selected':''}>Disattivato</option></select></label>
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn ghost" style="flex:1" id="m-x">Annulla</button>
      <button class="btn" style="flex:1" id="m-ok">💾 Salva</button></div>`,
   sh=>{
     const sel=new Set(u.settori);
     sh.querySelectorAll('#u-set .chip').forEach(b=>b.onclick=()=>{
       const k=b.dataset.s; sel.has(k)?sel.delete(k):sel.add(k); b.classList.toggle('on');
     });
     sh.querySelector('#m-x').onclick=chiudiModal;
     sh.querySelector('#m-ok').onclick=async()=>{
       const rec={ nome:sh.querySelector('#u-nome').value.trim(), codice:sh.querySelector('#u-cod').value.trim(),
                   ruolo:sh.querySelector('#u-ruolo').value, settori:[...sel], attivo:sh.querySelector('#u-att').value==='1' };
       if(!rec.nome||!rec.codice){ alert('Nome e codice sono obbligatori.'); return; }
       const { error } = u.id ? await sb.from('ord_utenti').update(rec).eq('id',u.id)
                              : await sb.from('ord_utenti').insert(rec);
       if(error){ alert('Errore: '+error.message); return; }
       chiudiModal(); vistaUtenti(); toast('Utente salvato');
     };
   });
}

/* ---------------- MODALE + TOAST ---------------- */
function modal(titolo, html, init){
  const root=$('#modal-root');
  root.innerHTML = `<div class="ov"><div class="sheet"><h2>${esc(titolo)}</h2><div style="height:10px"></div>${html}</div></div>`;
  root.querySelector('.ov').onclick = e => { if(e.target.classList.contains('ov')) chiudiModal(); };
  if(init) init(root.querySelector('.sheet'));
}
function chiudiModal(){ $('#modal-root').innerHTML=''; }
function toast(t){
  const d=document.createElement('div');
  d.textContent=t;
  d.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:70;font-size:14px;box-shadow:0 6px 20px #16202b40';
  document.body.appendChild(d); setTimeout(()=>d.remove(),1800);
}
</script>
</body>
