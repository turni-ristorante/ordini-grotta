/* ---------------- FILTRI E CATEGORIE (chip) ---------------- */
async function vistaChip(){
  S.view='chip'; S.setC = S.setC || settoriAnagUtente()[0];
  $('#savebar').classList.add('hide'); $('#btn-back').classList.remove('hide');
  $('#h-title').textContent='Filtri e categorie';
  $('#h-sub').textContent='Settori merceologici e posizioni';
  const t=$('#sector-tabs');
  t.innerHTML = settoriAnagUtente().map(s=>`<button class="tab ${S.setC===s?'on':''}" data-s="${s}">${nomeAnag(s)}</button>`).join('');
  t.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ S.setC=b.dataset.s; vistaChip(); });
  await caricaChip();
  render();

  function blocco(tipo, titolo){
    const voci = S.chips.filter(c=>c.settore===S.setC && c.tipo===tipo);
    return `<h3 style="margin:16px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)">${titolo}</h3>
      <div class="card"><div style="display:flex;gap:8px">
        <input class="inp" id="new-${tipo}" placeholder="Aggiungi…">
        <button class="btn" data-add="${tipo}">Aggiungi</button></div></div>
      ${voci.length?voci.map(c=>`<div class="umrow">
        <span>${esc(c.valore)}</span>
        <button class="btn ghost" data-ren="${c.id}" data-val="${esc(c.valore)}" data-tipo="${tipo}" style="padding:6px 10px">✏️</button>
        <button class="btn ghost" data-del="${c.id}" data-val="${esc(c.valore)}" data-tipo="${tipo}" style="padding:6px 10px">🗑</button>
      </div>`).join(''):'<p class="muted" style="margin:0 0 8px">Nessuna voce.</p>'}`;
  }

  function render(){
    $('#main').innerHTML = `<p class="muted">Le voci qui sotto compaiono come filtri negli ordini e come opzioni nella scheda articolo.</p>`
      + blocco('categoria','Settore merceologico') + blocco('posizione','Posizione');
    // aggiungi
    $('#main').querySelectorAll('[data-add]').forEach(b=>b.onclick=async()=>{
      const tipo=b.dataset.add, v=$('#new-'+tipo).value.trim(); if(!v) return;
      const seq=S.chips.filter(c=>c.settore===S.setC&&c.tipo===tipo).length+1;
      const { error } = await sb.from('ord_chip').insert({settore:S.setC, tipo, valore:v, seq});
      if(error){ alert(error.code==='23505'?'Questa voce esiste già.':'Errore: '+error.message); return; }
      await caricaChip(); render(); toast('Voce aggiunta');
    });
    // rinomina (aggiorna anche gli articoli che la usano)
    $('#main').querySelectorAll('[data-ren]').forEach(b=>b.onclick=async()=>{
      const tipo=b.dataset.tipo, vecchio=b.dataset.val;
      const nuovo=prompt('Rinomina "'+vecchio+'" in:', vecchio);
      if(!nuovo || nuovo.trim()===vecchio) return;
      const val=nuovo.trim();
      const u1 = await sb.from('ord_chip').update({valore:val}).eq('id',b.dataset.ren);
      if(u1.error){ alert(u1.error.code==='23505'?'Esiste già una voce con questo nome.':'Errore: '+u1.error.message); return; }
      const campo = tipo==='categoria'?'categoria':'posizione';
      await sb.from('ord_articoli').update({[campo]:val}).eq('settore',S.setC).eq(campo,vecchio);
      await Promise.all([caricaChip(), caricaArticoli()]); render(); toast('Rinominata ovunque');
    });
    // elimina (gli articoli che la usavano restano senza quella voce)
    $('#main').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      const tipo=b.dataset.tipo, val=b.dataset.val, campo=tipo==='categoria'?'categoria':'posizione';
      const { count } = await sb.from('ord_articoli').select('id',{count:'exact',head:true}).eq('settore',S.setC).eq(campo,val);
      if(!confirm(`Eliminare "${val}"?`+(count?`\n\n${count} articoli la usano: resteranno senza ${tipo}. Gli ordini già salvati non cambiano.`:''))) return;
      await sb.from('ord_chip').delete().eq('id',b.dataset.del);
      if(count) await sb.from('ord_articoli').update({[campo]:null}).eq('settore',S.setC).eq(campo,val);
      await Promise.all([caricaChip(), caricaArticoli()]); render(); toast('Voce eliminata');
    });
  }
}

/* ---------------- UNITÀ DI MISURA ---------------- */
async function vistaUM(){
  S.view='um'; $('#savebar').classList.add('hide'); $('#btn-back').classList.remove('hide'); $('#sector-tabs').innerHTML='';
  $('#h-title').textContent='Unità di misura';
  $('#h-sub').textContent='Il menù a tendina delle quantità, per settore';
  await caricaUM();
  const SET_OPT = [['Tutti','Tutti i settori'],['cucina','Cucina e pizzeria'],['sala_vini','Sala e vini'],['bar','Bar']];
  const etichettaSet = ss => (ss||[]).includes('Tutti')||!(ss||[]).length ? 'Tutti i settori'
      : ss.map(s=>({cucina:'Cucina/Pizzeria',sala_vini:'Sala e vini',bar:'Bar'}[s]||s)).join(', ');

  $('#main').innerHTML = `
    <div class="card"><label class="f"><span>Aggiungi unità</span>
      <div style="display:flex;gap:8px"><input class="inp" id="um-new" placeholder="es. Fusto">
      <button class="btn" id="um-add">Aggiungi</button></div></label>
      <div class="muted">La nuova unità nasce valida in tutti i settori: poi puoi restringerla toccandola.</div></div>
    ${S.umFull.map(u=>`<div class="umrow" data-um="${u.id}" style="cursor:pointer">
      <span>${esc(u.valore)}</span>
      <span class="muted" style="margin-right:6px">${esc(etichettaSet(u.settori))}</span>
      <button class="btn ghost" data-del="${u.id}" style="padding:6px 10px">🗑</button></div>`).join('')}`;

  $('#um-add').onclick=async()=>{
    const v=$('#um-new').value.trim(); if(!v) return;
    const { error } = await sb.from('ord_um').insert({valore:v, seq:S.umFull.length+1, settori:['Tutti']});
    if(error){ alert(error.code==='23505'?'Questa unità esiste già.':'Errore: '+error.message); return; }
    await caricaUM(); vistaUM(); toast('Unità aggiunta');
  };
  $('#main').querySelectorAll('[data-um]').forEach(row=>row.onclick=e=>{
    if(e.target.closest('[data-del]')) return;
    const u=S.umFull.find(x=>x.id==row.dataset.um); schedaUM(u, SET_OPT);
  });
  $('#main').querySelectorAll('[data-del]').forEach(b=>b.onclick=async(e)=>{
    e.stopPropagation();
    if(!confirm('Eliminare questa unità dal menù?\n\nGli ordini già salvati che la usano restano invariati.')) return;
    await sb.from('ord_um').delete().eq('id',b.dataset.del);
    await caricaUM(); vistaUM(); toast('Unità eliminata');
  });
}

function schedaUM(u, SET_OPT){
  const sel = new Set((u.settori&&u.settori.length)?u.settori:['Tutti']);
  modal('Unità: '+esc(u.valore), `
    <label class="f"><span>Nome</span><input class="inp" id="um-nome" value="${esc(u.valore)}"></label>
    <label class="f"><span>In quali ordini compare</span>
      <div class="chipwrap" id="um-set">${SET_OPT.map(([k,l])=>
        `<button type="button" class="chip ${sel.has(k)?'on':''}" data-s="${k}">${l}</button>`).join('')}</div>
      <div class="muted" style="margin-top:5px">Scegli "Tutti i settori" oppure uno o più settori specifici.</div></label>
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn ghost" style="flex:1" id="m-x">Annulla</button>
      <button class="btn" style="flex:1" id="m-ok">💾 Salva</button></div>`,
   sh=>{
     sh.querySelectorAll('#um-set .chip').forEach(b=>b.onclick=()=>{
       const k=b.dataset.s;
       if(k==='Tutti'){ sel.clear(); sel.add('Tutti'); }
       else { sel.delete('Tutti'); sel.has(k)?sel.delete(k):sel.add(k); if(!sel.size) sel.add('Tutti'); }
       sh.querySelectorAll('#um-set .chip').forEach(x=>x.classList.toggle('on', sel.has(x.dataset.s)));
     });
     sh.querySelector('#m-x').onclick=chiudiModal;
     sh.querySelector('#m-ok').onclick=async()=>{
       const nome=sh.querySelector('#um-nome').value.trim(); if(!nome){ alert('Il nome è obbligatorio.'); return; }
       const rec={ valore:nome, settori:[...sel] };
       const { error } = await sb.from('ord_um').update(rec).eq('id',u.id);
       if(error){ alert(error.code==='23505'?'Esiste già un\'unità con questo nome.':'Errore: '+error.message); return; }
       await caricaUM(); chiudiModal(); vistaUM(); toast('Unità aggiornata');
     };
   });
}

/* ---------------- ANAGRAFICA ---------------- */
async function vistaAnagrafica(){
  S.view='anagrafica'; S.q=''; S.faCat=null; S.faForn=null; S.setA=S.setA||settoriAnagUtente()[0];
  if(!S.fornitori || !S.fornitori.length) await caricaFornitori();
  $('#savebar').classList.add('hide'); $('#btn-back').classList.remove('hide');
  $('#h-title').textContent='Anagrafica articoli';
  $('#h-sub').textContent = vedeListino()?'Tutti i campi modificabili':'Consultazione';
  const t=$('#sector-tabs');
  t.innerHTML = settoriAnagUtente().map(s=>`<button class="tab ${S.setA===s?'on':''}" data-s="${s}">${nomeAnag(s)}</button>`).join('');
  t.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ S.setA=b.dataset.s; vistaAnagrafica(); });
  render();
  function render(){
    const artSet = S.articoli.filter(a=>a.settore===S.setA);
    // opzioni tendine, ricavate dagli articoli del settore
    const cats = [...new Set(artSet.map(a=>a.categoria).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
    const fornSet = new Set();
    artSet.forEach(a=>{
      [a.venditore_primario, a.venditore_alternativo].forEach(v=>{
        if(!v) return;
        (v.includes('/')?v.split('/'):[v]).forEach(x=>{ const n=x.trim(); if(n) fornSet.add(n); });
      });
    });
    const forns=[...fornSet].sort((a,b)=>a.localeCompare(b));

    $('#main').innerHTML = `
      ${vedeListino()?'<button class="btn full" id="btn-add" style="margin-bottom:10px">＋ Nuovo articolo</button>':''}
      <input class="inp" id="q" placeholder="🔍 Cerca per nome…" value="${esc(S.q)}" style="margin-bottom:8px">
      <div class="grid2" style="margin-bottom:8px">
        <select class="inp" id="fa-cat"><option value="">Tutte le categorie</option>
          ${cats.map(c=>`<option ${S.faCat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
        <select class="inp" id="fa-forn"><option value="">Tutti i fornitori</option>
          ${forns.map(f=>`<option ${S.faForn===f?'selected':''}>${esc(f)}</option>`).join('')}</select>
      </div>
      <div id="an-count" class="muted" style="margin-bottom:8px"></div>
      <div id="an-list"></div>`;

    const matchForn = a => {
      if(!S.faForn) return true;
      const campi=[a.venditore_primario, a.venditore_alternativo].filter(Boolean);
      return campi.some(v => (v.includes('/')?v.split('/').map(x=>x.trim()):[v.trim()]).includes(S.faForn));
    };
    const disegnaLista=()=>{
      const art=artSet.filter(a=>
        (!S.q || a.nome.toLowerCase().includes(S.q.toLowerCase())) &&
        (!S.faCat || a.categoria===S.faCat) &&
        matchForn(a));
      $('#an-count').textContent = `${art.length} ${art.length===1?'articolo':'articoli'}`;
      $('#an-list').innerHTML = art.map(a=>`<div class="art ${!a.attivo?'noprice':''}" data-a="${a.id}" style="cursor:pointer">
          <div class="art-top"><div style="flex:1">
            <div class="art-nm">${esc(a.nome)} ${!a.attivo?'<span class="badge b-warn">eliminato</span>':''}</div>
            <div class="art-meta">${[a.posizione?`<span class="pos">${esc(a.posizione)}</span>`:'',
              (a.reparti||[]).length?(a.reparti||[]).join('+'):'', a.categoria, a.um,
              a.venditore_primario?('🏷 '+esc(a.venditore_primario)):'',
              vedeListino()?(a.prezzo!=null?a.prezzo.toFixed(2)+' €':'<span class="badge b-warn">senza prezzo</span>'):''
            ].filter(Boolean).join(' · ')}</div>
          </div><span class="muted">›</span></div></div>`).join('')||'<div class="empty">Nessun articolo con questi filtri.</div>';
      $('#an-list').querySelectorAll('[data-a]').forEach(c=>c.onclick=()=>schedaArticolo(S.articoli.find(a=>a.id==c.dataset.a),render));
    };
    disegnaLista();
    $('#q').oninput=e=>{ S.q=e.target.value; disegnaLista(); };
    $('#fa-cat').onchange=e=>{ S.faCat=e.target.value||null; disegnaLista(); };
    $('#fa-forn').onchange=e=>{ S.faForn=e.target.value||null; disegnaLista(); };
    if(vedeListino()) $('#btn-add').onclick=()=>schedaArticolo(null,render);
  }
}

function schedaArticolo(a, done){
  const nuovo=!a, ro=!vedeListino();
  const setDef = (S.setA && SETTORI_ANAG.includes(S.setA)) ? S.setA : 'cucina';
  a = a || { settore:setDef, lista:(SETTORI[setDef]?.liste||['Cucina e pizzeria'])[0], reparti:[], attivo:true, seq:999 };
  const optForn = (S.fornitori||[]).map(f=>`<option value="${esc(f.nome)}">`).join('');
  const FF=(k,l)=>`<label class="f"><span>${l}</span><input class="inp" data-k="${k}" list="dl-forn" autocomplete="off" value="${esc(a[k]??'')}" ${ro?'disabled':''}></label>`;
  const F=(k,l,t='text')=>`<label class="f"><span>${l}</span><input class="inp" data-k="${k}" type="${t}" value="${esc(a[k]??'')}" ${ro?'disabled':''}></label>`;
  modal(nuovo?'Nuovo articolo':'Scheda articolo', `
    ${F('nome','Nome articolo')}
    <div class="grid2">
      <label class="f"><span>Settore</span><select class="inp" data-k="settore" ${ro?'disabled':''}>
        ${SETTORI_ANAG.map(k=>`<option value="${k}" ${a.settore===k?'selected':''}>${nomeAnag(k)}</option>`).join('')}</select></label>
      <label class="f"><span>Lista</span><select class="inp" data-k="lista" ${ro?'disabled':''}>
        ${['Cucina e pizzeria','Vini','Sala','Bar'].map(l=>`<option ${a.lista===l?'selected':''}>${l}</option>`).join('')}</select></label>
    </div>
    <div class="grid2">
      <label class="f"><span>Settore merceologico</span><select class="inp" data-k="categoria" ${ro?'disabled':''}>
        <option value="">—</option>
        ${chipList(a.settore,'categoria').map(c=>`<option ${a.categoria===c?'selected':''}>${esc(c)}</option>`).join('')}
        ${a.categoria && !chipList(a.settore,'categoria').includes(a.categoria)?`<option selected>${esc(a.categoria)}</option>`:''}
      </select></label>
      <label class="f"><span>Posizione / ubicazione</span><select class="inp" data-k="posizione" ${ro?'disabled':''}>
        <option value="">—</option>
        ${chipList(a.settore,'posizione').map(p=>`<option ${a.posizione===p?'selected':''}>${esc(p)}</option>`).join('')}
        ${a.posizione && !chipList(a.settore,'posizione').includes(a.posizione)?`<option selected>${esc(a.posizione)}</option>`:''}
      </select></label>
    </div>
    <label class="f rep-field" style="display:${repartiDi(a.settore).length?'block':'none'}"><span>In quali ordini deve comparire</span>
      <div class="chipwrap" id="a-rep">${repartiDi(a.settore).map(r=>`<button type="button" class="chip rep ${(a.reparti||[]).includes(r)?'on':''}" data-r="${r}" ${ro?'disabled':''}>${r}</button>`).join('')}</div>
      <div class="muted" style="margin-top:5px">Puoi sceglierne più di uno: l'articolo comparirà in ogni ordine selezionato, con quantità indipendenti.</div></label>
    <div class="grid2">
      <label class="f"><span>U.M.</span><select class="inp" data-k="um" ${ro?'disabled':''}>
        ${[...new Set([...(umDelSettore(a.settore)), ...(a.um?[a.um]:[])])].map(u=>`<option ${a.um===u?'selected':''}>${u}</option>`).join('')}</select></label>
      ${F('minimo_ordine','Minimo ordine')}
    </div>
    <div class="grid2">${F('anticipo','Anticipo ordine (1x1…)')}${F('seq','Ordine in lista','number')}</div>
    <label class="f"><span>Note</span><textarea class="inp" rows="2" data-k="note" ${ro?'disabled':''}>${esc(a.note??'')}</textarea></label>
    ${vedeListino()?`
      <h3 style="margin:16px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)">Listino</h3>
      <div class="grid2">${F('prezzo','Prezzo €','number')}${F('prezzo_um','Prezzo per (U.M.)')}</div>
      <div class="grid2">${FF('venditore_primario','Venditore primario')}${FF('venditore_alternativo','Venditore alternativo')}</div>
      <datalist id="dl-forn">${optForn}</datalist>
      <div class="grid2">${F('codice','Codice')}${F('tipo_consegna','Tipo consegna')}</div>
      <div class="grid2">${F('cod_vendita','Cod. vendita')}${F('annata','Annata')}</div>
      ${F('produttore','Produttore')}
      <div class="grid2">${F('uso1','Settore utilizzo 1')}${F('uso2','Settore utilizzo 2')}</div>
      ${F('uso3','Settore utilizzo 3')}
      <div style="display:flex;gap:8px;margin-top:14px">
        ${!nuovo?'<button class="btn warn" id="m-del">🗑</button>':''}
        <button class="btn ghost" style="flex:1" id="m-x">Annulla</button>
        <button class="btn" style="flex:1" id="m-ok">💾 Salva</button></div>`
    :'<button class="btn ghost full" id="m-x">Chiudi</button>'}`,
   sh=>{
     let modificato=false;
     const segnaMod=()=>{ modificato=true; };
     const chiudiSicuro=()=>{ if(modificato && !confirm('Hai modifiche non salvate. Uscire senza salvare?')) return; chiudiModal(); };
     sh.querySelector('#m-x').onclick=chiudiSicuro;
     // intercetta anche il tap fuori dalla scheda
     const ov=sh.closest('.ov'); if(ov) ov.onclick=e=>{ if(e.target===ov) chiudiSicuro(); };
     if(ro) return;
     sh.querySelectorAll('[data-k]').forEach(i=>{ i.addEventListener('input',segnaMod); i.addEventListener('change',segnaMod); });
     const repSel = new Set(a.reparti||[]);
     const repBtns = sh.querySelectorAll('#a-rep [data-r]');
     repBtns.forEach(b=>b.onclick=()=>{ const r=b.dataset.r; repSel.has(r)?repSel.delete(r):repSel.add(r); b.classList.toggle('on'); segnaMod(); });
     // mostra/nasconde reparto in base al settore scelto
     const setSel = sh.querySelector('[data-k="settore"]');
     const repField = sh.querySelector('.rep-field');
     if(setSel) setSel.onchange=()=>{ repField.style.display = repartiDi(setSel.value).length?'block':'none'; };
     if(!nuovo) sh.querySelector('#m-del').onclick=async()=>{
       if(!confirm('Eliminare "'+a.nome+'"?\n\nSparisce dagli ordini futuri, ma resta intatto in tutti gli ordini già fatti.')) return;
       await sb.from('ord_articoli').update({attivo:false}).eq('id',a.id);
       await caricaArticoli(); chiudiModal(); done(); toast('Articolo eliminato');
     };
     sh.querySelector('#m-ok').onclick=async()=>{
       modificato=false;   // stiamo salvando: niente avviso
       const rec={...a};
       sh.querySelectorAll('[data-k]').forEach(i=>{
         let v = i.value; if(typeof v==='string') v=v.trim();
         if(i.type==='number') v = v===''?null:parseFloat(v);
         rec[i.dataset.k] = v===''?null:v;
       });
       const haRep = repartiDi(rec.settore).length>0;
       rec.reparti = haRep ? [...repSel] : [];
       if(!rec.nome){ alert('Il nome è obbligatorio.'); modificato=true; return; }
       if(haRep && !rec.reparti.length){
         alert('Scegli almeno un reparto.\n\nSenza reparto l\'articolo non comparirebbe in nessun ordine.'); modificato=true; return;
       }
       rec.aggiornato_il=new Date().toISOString(); delete rec.creato_il;
       const { error } = rec.id ? await sb.from('ord_articoli').update(rec).eq('id',rec.id)
                                : await sb.from('ord_articoli').insert(rec);
       if(error){ alert('Errore: '+error.message); return; }
       await caricaArticoli(); chiudiModal(); done(); toast('Articolo salvato');
     };
   });
}

/* ---------------- UTENTI (solo manager) ---------------- */
async function vistaUtenti(){
  S.view='utenti'; $('#savebar').classList.add('hide'); $('#btn-back').classList.remove('hide'); $('#sector-tabs').innerHTML='';
  $('#h-title').textContent='Utenti e accessi'; $('#h-sub').textContent='Chi vede cosa';
  const { data } = await sb.from('ord_utenti').select('*').order('id');
  $('#main').innerHTML = '<button class="btn full" id="btn-addu" style="margin-bottom:10px">＋ Nuovo utente</button>' +
    (data||[]).map(u=>`<div class="card" data-u="${u.id}" style="cursor:pointer;display:flex;align-items:center;gap:10px">
      <div style="flex:1">
        <div style="font-weight:600">${esc(u.nome)} ${!u.attivo?'<span class="badge b-warn">disattivato</span>':''}</div>
        <div class="muted">${u.ruolo} · ${u.settori.map(nomeSettore).join(', ')||'nessun settore'}</div>
      </div><span class="muted">›</span></div>`).join('');
  $('#btn-addu').onclick=()=>schedaUtente(null);
  $('#main').querySelectorAll('[data-u]').forEach(c=>c.onclick=()=>schedaUtente((data||[]).find(u=>u.id==c.dataset.u)));
}

function schedaUtente(u){
  const nuovo=!u;
  u = u || { nome:'', codice:'', ruolo:'operatore', settori:[], attivo:true };
  modal(nuovo?'Nuovo utente':'Scheda utente', `
    <label class="f"><span>Nome</span><input class="inp" id="u-nome" value="${esc(u.nome)}"></label>
    <label class="f"><span>Codice personale</span><input class="inp" id="u-cod" value="${esc(u.codice)}"></label>
    <label class="f"><span>Ruolo</span><select class="inp" id="u-ruolo">
      <option value="operatore" ${u.ruolo==='operatore'?'selected':''}>Operatore — crea ordini e inserisce le quantità</option>
      <option value="responsabile" ${u.ruolo==='responsabile'?'selected':''}>Responsabile ordini — vede tutto, flagga, non tocca le quantità</option>
      <option value="manager" ${u.ruolo==='manager'?'selected':''}>Manager — accesso completo</option></select></label>
    <label class="f"><span>Settori visibili</span>
      <div class="chipbar" id="u-set">${Object.entries(SETTORI).map(([k,v])=>
        `<button class="chip ${u.settori.includes(k)?'on':''}" data-s="${k}">${v.nome}</button>`).join('')}</div></label>
    <label class="f"><span>Stato</span><select class="inp" id="u-att">
      <option value="1" ${u.attivo?'selected':''}>Attivo</option>
      <option value="0" ${!u.attivo?'selected':''}>Disattivato</option></select></label>
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn ghost" style="flex:1" id="m-x">Annulla</button>
      <button class="btn" style="flex:1" id="m-ok">💾 Salva</button></div>`,
   sh=>{
     const sel=new Set(u.settori);
     sh.querySelectorAll('#u-set .chip').forEach(b=>b.onclick=()=>{ const k=b.dataset.s; sel.has(k)?sel.delete(k):sel.add(k); b.classList.toggle('on'); });
     sh.querySelector('#m-x').onclick=chiudiModal;
     sh.querySelector('#m-ok').onclick=async()=>{
       const rec={ nome:sh.querySelector('#u-nome').value.trim(), codice:sh.querySelector('#u-cod').value.trim(),
                   ruolo:sh.querySelector('#u-ruolo').value, settori:[...sel], attivo:sh.querySelector('#u-att').value==='1' };
       if(!rec.nome||!rec.codice){ alert('Nome e codice sono obbligatori.'); return; }
       const { error } = u.id ? await sb.from('ord_utenti').update(rec).eq('id',u.id) : await sb.from('ord_utenti').insert(rec);
       if(error){ alert(error.code==='23505'?'Questo codice è già usato da un altro utente.':'Errore: '+error.message); return; }
       chiudiModal(); vistaUtenti(); toast('Utente salvato');
     };
   });
}

/* ============================================================
   EXPORT PDF — multi-ordine, unico o separato, con flag "ordinato"
   ============================================================ */
const fornitoreDiRiga = (r,a) => {
  if(r.fornitore) return r.fornitore;
  const v = a?.venditore_primario?.trim();
  if(!v) return null;
  return v.includes('/') ? null : v;   // multiplo = da scegliere
};
// una riga va (ri)esportata se ha quantità e non è ordinata, oppure è stata modificata dopo l'ordine
const daEsportare = r => r.quantita>0 && (!r.ordinato || r.da_riesportare);

// Schermata export lanciata dalla LISTA ordini
async function vistaExport(){
  S.view='export'; $('#savebar').classList.add('hide'); $('#btn-back').classList.remove('hide'); $('#sector-tabs').innerHTML='';
  $('#h-title').textContent='Esporta ordini'; $('#h-sub').textContent='Scegli gli ordini e il formato';
  await caricaOrdini();
  const aperti = S.ordini.filter(o=>o.stato!=='chiuso');
  if(!aperti.length){ $('#main').innerHTML='<div class="empty">Nessun ordine da esportare.</div>'; return; }
  $('#main').innerHTML = `
    <div class="card">
      <div class="flt-lab">Formato</div>
      <label style="display:flex;gap:8px;align-items:flex-start;margin:6px 0"><input type="radio" name="fmt" value="unico" checked>
        <span><b>PDF unico per fornitore</b><br><span class="muted">Un documento per fornitore che unisce gli ordini scelti, con le righe divise per reparto.</span></span></label>
      <label style="display:flex;gap:8px;align-items:flex-start"><input type="radio" name="fmt" value="sep">
        <span><b>Separati per reparto</b><br><span class="muted">Un documento per ogni reparto e fornitore.</span></span></label>
    </div>
    <div class="flt-lab" style="margin:4px 0 6px">Ordini da includere</div>
    ${aperti.map(o=>`<label class="card" style="display:flex;align-items:center;gap:10px;cursor:pointer">
        <input type="checkbox" class="ex-o" value="${o.id}">
        <div style="flex:1"><div style="font-weight:600">${titoloOrdine(o)}</div>
          <div class="muted">${o.stato==='ordini_chiusi'?'ordini chiusi':'aperto'} · creato da ${esc(o.creato_nome||'—')}</div></div>
      </label>`).join('')}
    <button class="btn full" id="ex-go" style="margin-top:6px">Procedi →</button>`;
  $('#ex-go').onclick=async()=>{
    const ids=[...document.querySelectorAll('.ex-o:checked')].map(c=>+c.value);
    if(!ids.length){ alert('Seleziona almeno un ordine.'); return; }
    const fmt=document.querySelector('input[name="fmt"]:checked').value;
    const ordiniSel=aperti.filter(o=>ids.includes(o.id));
    const { data } = await sb.from('ord_righe').select('*').in('ordine_id',ids);
    const conQta=(data||[]).filter(r=>r.quantita>0);
    // sempre incluse: nuove o modificate dopo l'ordine
    const sempre = conQta.filter(daEsportare);
    // gia' ordinate (e non modificate): da proporre
    const giaOrd = conQta.filter(r=>r.ordinato && !r.da_riesportare);
    if(!sempre.length && !giaOrd.length){ alert('Gli ordini scelti non hanno articoli da esportare.'); return; }

    const continua = (righe)=>{
      if(!righe.length){ alert('Nessun articolo selezionato per l\'esportazione.'); return; }
      const selIds = righe.map(r=>r.id);
      const daAssegnare=righe.filter(r=>!fornitoreDiRiga(r, S.articoli.find(x=>x.id===r.articolo_id)));
      const lancia=(rr)=> fmt==='unico' ? exportUnico(ordiniSel, rr) : exportSeparato(ordiniSel, rr);
      if(daAssegnare.length) assegnaFornitori(daAssegnare, async()=>{
        const { data:d2 } = await sb.from('ord_righe').select('*').in('ordine_id',ids);
        lancia((d2||[]).filter(r=>selIds.includes(r.id)));
      });
      else lancia(righe);
    };

    if(giaOrd.length){
      // chiede quali già-ordinati reinserire
      modal('Alcuni sono già ordinati',
        `<p>${giaOrd.length} articoli di questi ordini risultano <b>già ordinati</b>. Vuoi reinserirli nel PDF?</p>
         <p class="muted">Spunta quelli da includere. Resteranno comunque segnati come ordinati.</p>
         <div style="max-height:46vh;overflow:auto">
         ${giaOrd.map((r,i)=>`<label class="card" style="display:flex;gap:8px;align-items:center;padding:9px">
             <input type="checkbox" class="ro" data-i="${i}">
             <div style="flex:1"><b>${esc(r.nome_snapshot)}</b> — ${r.quantita} ${esc(r.qta_um||'')}
             <div class="muted">${nomeSettore(r.settore)}${r.fornitore?' · '+esc(r.fornitore):''}</div></div>
           </label>`).join('')}
         </div>
         <div style="display:flex;gap:8px;margin-top:6px">
           <button class="btn ghost" id="ro-none">Nessuno</button>
           <button class="btn ghost" id="ro-all">Tutti</button>
         </div>
         <div style="display:flex;gap:8px;margin-top:10px">
           <button class="btn ghost" style="flex:1" id="m-x">Annulla</button>
           <button class="btn" style="flex:1" id="m-ok">Continua</button></div>`,
        sh=>{
          sh.querySelector('#ro-all').onclick=()=>sh.querySelectorAll('.ro').forEach(c=>c.checked=true);
          sh.querySelector('#ro-none').onclick=()=>sh.querySelectorAll('.ro').forEach(c=>c.checked=false);
          sh.querySelector('#m-x').onclick=chiudiModal;
          sh.querySelector('#m-ok').onclick=()=>{
            const reins=[...sh.querySelectorAll('.ro:checked')].map(c=>giaOrd[+c.dataset.i]);
            chiudiModal();
            continua([...sempre, ...reins]);
          };
        });
    } else {
      continua(sempre);
    }
  };
}

function ordineDiRiga(r){ return S.ordini.find(o=>o.id===r.ordine_id); }

/* ---------------- PRODOTTI DA VALUTARE (righe libere) ---------------- */
async function vistaDaValutare(){
  S.view='valutare'; $('#savebar').classList.add('hide'); $('#btn-back').classList.remove('hide'); $('#sector-tabs').innerHTML='';

    return `<div class="card" data-v="${i}">
      <div style="font-weight:600">${esc(r.nome_snapshot)} <span class="muted">— ${r.quantita} ${esc(r.qta_um||'')}</span></div>

      <div style="display:flex;gap:8px;margin-top:8px">

      um:r.qta_um||S.um[0], reparti:(r.settore==='cucina'?['Cucina']:[]), attivo:true, seq:999 };
    schedaArticolo(finto, async()=>{
      await caricaArticoli();
      const nuovo=S.articoli.find(x=>x.settore===finto.settore && x.nome===finto.nome);
      if(nuovo) await sb.from('ord_righe').update({valutata:true, promossa_articolo_id:nuovo.id}).eq('id',r.id);

  });
}


// PDF UNICO: un file per fornitore, righe divise per ordine/reparto
function exportUnico(ordini, righe){
  const perForn={};
  righe.forEach(r=>{
    const a=S.articoli.find(x=>x.id===r.articolo_id);
    const f=fornitoreDiRiga(r,a)||'Senza fornitore';
    (perForn[f]=perForn[f]||[]).push({r,a});
  });
  cardExport(Object.keys(perForn).sort(), perForn, ordini, 'unico');
}
// SEPARATI: un file per (reparto, fornitore)
function exportSeparato(ordini, righe){
  const gruppi={}; // chiave "settore||fornitore"
  righe.forEach(r=>{
    const a=S.articoli.find(x=>x.id===r.articolo_id);
    const f=fornitoreDiRiga(r,a)||'Senza fornitore';
    const k=r.settore+'||'+f;
    (gruppi[k]=gruppi[k]||{settore:r.settore,forn:f,voci:[]}).voci.push({r,a});
  });
  cardExportSep(gruppi, ordini);
}

function bloccoAzioni(idx, email){
  return `<button class="btn ghost" data-pdf="${idx}" style="padding:8px 12px">📄</button>
    <button class="btn ghost" data-shr="${idx}" style="padding:8px 12px">📤</button>
    ${email?`<button class="btn ghost" data-mail="${idx}" style="padding:8px 12px">✉️</button>`:''}`;
}

function cardExport(nomi, perForn, ordini, modoFmt){
  modal('PDF unico per fornitore',
    `<p class="muted">Un documento per fornitore. Dopo la generazione puoi segnare gli articoli come ordinati.</p>
     ${nomi.map((n,i)=>{ const f=S.fornitori.find(x=>x.nome===n);
       return `<div class="card" style="display:flex;align-items:center;gap:8px">
         <div style="flex:1"><div style="font-weight:600">${esc(n)}</div>
           <div class="muted">${perForn[n].length} articoli${f?.email?' · '+esc(f.email):''}</div></div>
         ${bloccoAzioni(i, f?.email)}</div>`; }).join('')}
     <button class="btn ghost full" id="m-x" style="margin-top:8px">Chiudi</button>`,
    sh=>{
      sh.querySelector('#m-x').onclick=()=>{ chiudiModal(); vistaOrdini(); };
      const run=(i,modo)=>{ const n=nomi[i]; generaPDF(n, perForn[n], modo, ordini, true); chiediFlag(n, perForn[n]); };
      sh.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>run(+b.dataset.pdf,'save'));
      sh.querySelectorAll('[data-shr]').forEach(b=>b.onclick=()=>run(+b.dataset.shr,'share'));
      sh.querySelectorAll('[data-mail]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.mail,n=nomi[i],f=S.fornitori.find(x=>x.nome===n);
        generaPDF(n, perForn[n],'save', ordini, true); apriMail(f); chiediFlag(n, perForn[n]); });
    });
}

function cardExportSep(gruppi, ordini){
  const chiavi=Object.keys(gruppi).sort();
  modal('Separati per reparto',
    `<p class="muted">Un documento per ogni reparto e fornitore.</p>
     ${chiavi.map((k,i)=>{ const g=gruppi[k], f=S.fornitori.find(x=>x.nome===g.forn);
       return `<div class="card" style="display:flex;align-items:center;gap:8px">
         <div style="flex:1"><div style="font-weight:600">${esc(g.forn)}</div>
           <div class="muted">${nomeSettore(g.settore)} · ${g.voci.length} articoli</div></div>
         ${bloccoAzioni(i, f?.email)}</div>`; }).join('')}
     <button class="btn ghost full" id="m-x" style="margin-top:8px">Chiudi</button>`,
    sh=>{
      sh.querySelector('#m-x').onclick=()=>{ chiudiModal(); vistaOrdini(); };
      const run=(i,modo)=>{ const g=gruppi[chiavi[i]]; generaPDF(g.forn, g.voci, modo, ordini.filter(o=>o.settore===g.settore), false); chiediFlag(g.forn, g.voci); };
      sh.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>run(+b.dataset.pdf,'save'));
      sh.querySelectorAll('[data-shr]').forEach(b=>b.onclick=()=>run(+b.dataset.shr,'share'));
      sh.querySelectorAll('[data-mail]').forEach(b=>b.onclick=()=>{ const g=gruppi[chiavi[+b.dataset.mail]],f=S.fornitori.find(x=>x.nome===g.forn);
        generaPDF(g.forn,g.voci,'save',ordini.filter(o=>o.settore===g.settore),false); apriMail(f); chiediFlag(g.forn,g.voci); });
    });
}

function apriMail(f){
  if(!f?.email) return;
  const ogg=encodeURIComponent('Ordine Grotta Marcello');
  const corpo=encodeURIComponent('Buongiorno,\nin allegato il nostro ordine.\n\nGrazie,\nGrotta Marcello');
  setTimeout(()=>{ location.href=`mailto:${f.email}?subject=${ogg}&body=${corpo}`; }, 700);
}

// Conferma flag "ordinato" solo sulle righe esportate
function chiediFlag(fornitore, voci){
  const daFlag=voci.filter(({r})=>!r.ordinato || r.da_riesportare);
  if(!daFlag.length) return;
  modal('Segno come ordinati?',
    `<p>Vuoi segnare come <b>ordinati</b> i ${daFlag.length} articoli di <b>${esc(fornitore)}</b> appena esportati?</p>
     <p class="muted">Solo questi articoli. Ciò che è già consegnato non viene toccato.</p>
     <div style="display:flex;gap:8px;margin-top:10px">
       <button class="btn ghost" style="flex:1" id="m-no">No, solo PDF</button>
       <button class="btn" style="flex:1" id="m-si">Sì, segna ordinati</button></div>`,
    sh=>{
      sh.querySelector('#m-no').onclick=chiudiModal;
      sh.querySelector('#m-si').onclick=async()=>{
        const now=new Date().toISOString();
        const ids=daFlag.map(({r})=>r.id).filter(Boolean);
        const { error } = await sb.from('ord_righe').update({ordinato:true, ordinato_il:now, da_riesportare:false, esportato_il:now}).in('id',ids);
        if(error){ alert('Errore: '+error.message); return; }
        daFlag.forEach(({r})=>{ r.ordinato=true; r.da_riesportare=false; });
        chiudiModal(); toast(daFlag.length+' articoli segnati come ordinati');
      };
    });
}

function assegnaFornitori(righe, poi){
  const opts = S.fornitori.map(f=>f.nome);
  const corpo = righe.map((r,i)=>{
    const a = S.articoli.find(x=>x.id===r.articolo_id);
    const sugg = a?.venditore_primario?.includes('/')
      ? a.venditore_primario.split('/').map(s=>s.trim()).filter(Boolean) : [];
    const lista = [...new Set([...sugg, ...opts])];
    return `<div class="card" style="padding:10px">
      <div style="font-weight:600;margin-bottom:6px">${esc(r.nome_snapshot)} <span class="muted">— ${r.quantita} ${esc(r.qta_um||'')}</span></div>
      ${sugg.length?`<div class="muted" style="margin-bottom:5px">indicati a listino: ${esc(sugg.join(' · '))}</div>`:'<div class="muted" style="margin-bottom:5px">nessun fornitore a listino</div>'}
      <select class="inp" data-f="${i}">
        <option value="">— scegli fornitore —</option>
        ${lista.map(n=>`<option>${esc(n)}</option>`).join('')}
      </select></div>`;
  }).join('');
  modal('A chi ordiniamo?', `
    <p class="muted">${righe.length} articoli non hanno un fornitore univoco. Scegli per questo ordine: la scelta resta salvata sulla riga e non modifica l'anagrafica.</p>
    ${corpo}
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn ghost" style="flex:1" id="m-x">Annulla</button>
      <button class="btn" style="flex:1" id="m-ok">Conferma e continua</button></div>`,
    sh=>{
      sh.querySelector('#m-x').onclick=chiudiModal;
      sh.querySelector('#m-ok').onclick=async()=>{
        const upd=[];
        righe.forEach((r,i)=>{
          const v=sh.querySelector(`[data-f="${i}"]`).value;
          if(v){ r.fornitore=v; upd.push({id:r.id, fornitore:v}); }
        });
        if(upd.length!==righe.length){ alert('Assegna un fornitore a tutti gli articoli elencati.'); return; }
        for(const u of upd) await sb.from('ord_righe').update({fornitore:u.fornitore}).eq('id',u.id);
        chiudiModal(); poi();
      };
    });
}

// genera il PDF. Se dividiPerReparto=true, mette un sottotitolo per ogni settore.
function generaPDF(fornitore, voci, modo, ordini, dividiPerReparto){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const VIOLA = [107,61,92], GRIGIO = [123,107,117];
  const pw = doc.internal.pageSize.getWidth();
  let y = 14;
  if(typeof GM_LOGO !== 'undefined'){
    const lw = 42, lh = lw * (typeof GM_LOGO_RATIO!=='undefined'?GM_LOGO_RATIO:0.4269);
    try { doc.addImage(GM_LOGO, 'JPEG', (pw-lw)/2, y, lw, lh); y += lh + 3; } catch(e){ y += 2; }
  } else { doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(...VIOLA); doc.text('GROTTA MARCELLO', pw/2, y+6, {align:'center'}); y += 12; }
  doc.setDrawColor(...VIOLA); doc.setLineWidth(0.6); doc.line(16, y, pw-16, y); y += 7;

  const date=[...new Set((ordini||[]).map(o=>dataIT(o.data)))].join(', ');
  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(0);
  doc.text('ORDINE FORNITORE', 16, y);
  doc.setFont('helvetica','bold'); doc.setTextColor(...VIOLA); doc.setFontSize(11);
  doc.text(String(fornitore), pw-16, y, {align:'right'}); y += 5;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...GRIGIO);
  doc.text('Data: ' + (date||dataIT(oggi())), 16, y);
  const forn = S.fornitori.find(f=>f.nome===fornitore);
  if(forn?.email) doc.text(forn.email, pw-16, y, {align:'right'});
  y += 4.5; doc.text('Compilato da: ' + S.user.nome, 16, y); y += 6;

  const colStyle={ 0:{cellWidth:22}, 1:{cellWidth:74}, 2:{cellWidth:14, halign:'right'}, 3:{cellWidth:16}, 4:{cellWidth:52, textColor:GRIGIO, fontSize:8.5} };
  const head=[['Codice','Prodotto','Q.tà','U.M.','Note']];
  const stampaTabella=(startY, righe)=>{
    doc.autoTable({ startY, head, body: righe.map(({r,a})=>[ a?.codice||'', r.nome_snapshot, String(r.quantita), r.qta_um||(a?.um||''), r.note_riga||'' ]),
      styles:{ fontSize:9, cellPadding:2.6, textColor:[40,40,40] },
      headStyles:{ fillColor:VIOLA, textColor:255, fontStyle:'bold' },
      alternateRowStyles:{ fillColor:[242,234,239] }, columnStyles:colStyle, margin:{left:16,right:16} });
    return doc.lastAutoTable.finalY;
  };

  if(dividiPerReparto){
    const perSet={}; voci.forEach(v=>{ (perSet[v.r.settore]=perSet[v.r.settore]||[]).push(v); });
    Object.keys(perSet).sort().forEach(set=>{
      doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...VIOLA);
      doc.text(nomeSettore(set), 16, y+1); y+=2;
      y = stampaTabella(y+2, perSet[set]) + 7;
    });
  } else {
    y = stampaTabella(y, voci) + 6;
  }

  doc.setFontSize(9); doc.setTextColor(...GRIGIO);
  doc.text(`${voci.length} ${voci.length===1?'articolo':'articoli'} · generato il ${new Date().toLocaleString('it-IT')}`, 16, y);
  const ph = doc.internal.pageSize.getHeight();
  doc.setFontSize(8); doc.setTextColor(...GRIGIO);
  doc.text('Grotta Marcello · Rifugio del gusto · Cagliari', pw/2, ph-12, {align:'center'});

  const nomeFile = `Ordine_${(ordini&&ordini[0]?ordini[0].data:oggi())}_${fornitore.replace(/[^\w]/g,'')}.pdf`;
  if(modo==='share' && navigator.share){
    const blob=doc.output('blob'); const file=new File([blob],nomeFile,{type:'application/pdf'});
    navigator.share({files:[file], title:nomeFile}).catch(()=>doc.save(nomeFile));
  } else doc.save(nomeFile);
}

/* ============================================================
   ARCHIVIO — quanto abbiamo ordinato di X in un periodo
   ============================================================ */
async function vistaArchivio(){
  S.view='archivio'; $('#savebar').classList.add('hide'); $('#btn-back').classList.remove('hide'); $('#sector-tabs').innerHTML='';
  $('#h-title').textContent='Archivio ordini';
  $('#h-sub').textContent='Quanto è stato ordinato e ricevuto, e quando';
  const a30 = new Date(Date.now()-30*86400000).toISOString().slice(0,10);
  // gli operatori vedono solo i propri settori
  const settoriVisibili = vedeListino() ? ['cucina','pizzeria','sala_vini','bar'] : (S.user.settori||[]);
  $('#main').innerHTML = `
    <div class="card">
      <label class="f"><span>Articolo (anche parte del nome)</span>
        <input class="inp" id="ar-q" placeholder="es. pomodoro cherry"></label>
      <div class="grid2">
        <label class="f"><span>Dal</span><input class="inp" type="date" id="ar-d1" value="${a30}"></label>
        <label class="f"><span>Al</span><input class="inp" type="date" id="ar-d2" value="${oggi()}"></label>
      </div>
      <label class="f"><span>Settore</span><select class="inp" id="ar-set">
        <option value="">${vedeListino()?'Tutti':'Tutti i miei settori'}</option>
        ${settoriVisibili.map(s=>`<option value="${s}">${nomeSettore(s)}</option>`).join('')}</select></label>
      <button class="btn full" id="ar-go">🔎 Cerca</button>
    </div>
    <div id="ar-res"></div>`;
  $('#ar-go').onclick=cerca;
  $('#ar-q').addEventListener('keydown',e=>{ if(e.key==='Enter') cerca(); });

  async function cerca(){
    const q=$('#ar-q').value.trim(), d1=$('#ar-d1').value, d2=$('#ar-d2').value, set=$('#ar-set').value;
    const res=$('#ar-res'); res.innerHTML='<p class="muted">Cerco…</p>';
    let sel = sb.from('ord_righe').select('*, ord_ordini!inner(data,settore,stato,eliminato_il,creato_nome)')
      .is('ord_ordini.eliminato_il',null);
    if(d1) sel = sel.gte('ord_ordini.data', d1);
    if(d2) sel = sel.lte('ord_ordini.data', d2);
    if(set) sel = sel.eq('ord_ordini.settore', set);
    else if(!vedeListino()) sel = sel.in('ord_ordini.settore', settoriVisibili);
    if(q)   sel = sel.ilike('nome_snapshot', '%'+q+'%');
    const { data, error } = await sel;
    if(error){ res.innerHTML='<p class="muted" style="color:var(--warn)">Errore: '+esc(error.message)+'</p>'; return; }
    const righe = (data||[]).filter(r=>Number(r.quantita||0)>0 || Number(r.ricevuto||0)>0);
    if(!righe.length){ res.innerHTML='<div class="empty">Nessun ordine trovato in questo periodo.</div>'; return; }

    const per = {};
    righe.forEach(r=>{
      const k = r.nome_snapshot + '||' + (r.qta_um||'');
      per[k] = per[k] || { nome:r.nome_snapshot, um:r.qta_um||'', ordinato:0, ricevuto:0, righe:[] };
      per[k].ordinato += Number(r.quantita||0);
      per[k].ricevuto += Number(r.ricevuto||0);
      per[k].righe.push(r);
    });
    const gruppi = Object.values(per).sort((a,b)=>b.ricevuto-a.ricevuto || b.ordinato-a.ordinato);

    res.innerHTML = `
      <h3 style="margin:6px 0 10px;font-size:14px">${gruppi.length} ${gruppi.length===1?'articolo':'articoli'} · ${dataIT(d1)} → ${dataIT(d2)}</h3>
      ${gruppi.map((g,i)=>`
        <div class="card">
          <div style="display:flex;align-items:baseline;gap:8px">
            <div style="flex:1;font-weight:600">${esc(g.nome)}</div>
            <div style="text-align:right">
              <div class="dsp" style="font-size:20px;font-weight:700;color:var(--acc)">${g.ricevuto.toLocaleString('it-IT')} ${esc(g.um)}</div>
              <div class="muted" style="font-size:11.5px">ricevuti · ordinati ${g.ordinato.toLocaleString('it-IT')} ${esc(g.um)}</div>
            </div>
          </div>
          <button class="chip" data-det="${i}" style="margin-top:8px">Dettaglio (${g.righe.length} ordini)</button>
          <div id="det-${i}" class="hide" style="margin-top:8px">
            ${g.righe.sort((x,y)=>x.ord_ordini.data.localeCompare(y.ord_ordini.data)).map(r=>{
              const rich = r.qta_richiesta!=null ? r.qta_richiesta : r.quantita;
              const ric  = r.ricevuto!=null ? r.ricevuto : '—';
              const stato = r.consegnato?'<span style="color:var(--acc)">ricevuto</span>':r.ordinato?'<span style="color:var(--ord)">ordinato</span>':'<span style="color:var(--warn)">non ordinato</span>';
              return `<div style="padding:6px 0;border-top:1px solid var(--line);font-size:13.5px">
                <b>${dataIT(r.ord_ordini.data)}</b> · ${nomeSettore(r.ord_ordini.settore)}${r.fornitore?' · '+esc(r.fornitore):''}
                <div class="muted" style="margin-top:2px">richiesti <b>${rich}</b> → ordinati <b>${r.quantita??0}</b> → ricevuti <b>${ric}</b> ${esc(r.qta_um||'')} · ${stato}</div>
              </div>`;
            }).join('')}
          </div>
        </div>`).join('')}`;
    res.querySelectorAll('[data-det]').forEach(b=>b.onclick=()=>{
      const d=document.getElementById('det-'+b.dataset.det); d.classList.toggle('hide');
    });
  }
}

/* ============================================================
   ANDAMENTO ECONOMICO — prezzi reali vs listino, scostamenti
   ============================================================ */
async function vistaAndamento(){
  S.view='andamento'; $('#savebar').classList.add('hide'); $('#btn-back').classList.remove('hide'); $('#sector-tabs').innerHTML='';
  $('#h-title').textContent='Andamento economico'; $('#h-sub').textContent='Prezzi reali a confronto col listino (IVA esclusa)';
  const a90 = new Date(Date.now()-90*86400000).toISOString().slice(0,10);
  $('#main').innerHTML = `
    <div class="card">
      <div class="grid2">
        <label class="f"><span>Dal</span><input class="inp" type="date" id="an-d1" value="${a90}"></label>
        <label class="f"><span>Al</span><input class="inp" type="date" id="an-d2" value="${oggi()}"></label>
      </div>
      <label class="f"><span>Soglia scostamento da evidenziare</span>
        <select class="inp" id="an-sog"><option value="5">± 5%</option><option value="10">± 10%</option><option value="15">± 15%</option><option value="0">Mostra tutto</option></select></label>
      <button class="btn full" id="an-go">🔎 Analizza</button>
    </div>
    <div id="an-res"></div>`;
  $('#an-go').onclick=analizza;

  async function analizza(){
    const d1=$('#an-d1').value, d2=$('#an-d2').value, sog=Number($('#an-sog').value);
    const res=$('#an-res'); res.innerHTML='<p class="muted">Analizzo…</p>';
    let sel = sb.from('ord_righe').select('*, ord_ordini!inner(data,settore,eliminato_il)')
      .is('ord_ordini.eliminato_il',null).not('prezzo_ric_totale','is',null).gt('ricevuto',0);
    if(d1) sel=sel.gte('ord_ordini.data',d1);
    if(d2) sel=sel.lte('ord_ordini.data',d2);
    const { data, error } = await sel;
    if(error){ res.innerHTML='<p class="muted" style="color:var(--warn)">Errore: '+esc(error.message)+'</p>'; return; }
    const righe=data||[];
    if(!righe.length){ res.innerHTML='<div class="empty">Nessun prezzo di ricezione registrato in questo periodo.</div>'; return; }

    // KPI: speso reale vs atteso a listino (solo righe confrontabili per l'atteso)
    let spesoReale=0, attesoListino=0, confrontabili=0;
    righe.forEach(r=>{
      const a=S.articoli.find(x=>x.id===r.articolo_id);
      const sc=calcScostamento(r,a);
      spesoReale += Number(r.prezzo_ric_totale||0);
      if(sc && sc.comparabile){ attesoListino += sc.snap*Number(r.ricevuto||0); confrontabili++; }
    });
    const diff = spesoReale-attesoListino;
    const diffPct = attesoListino>0 ? diff/attesoListino*100 : null;

    // per articolo: ultimo prezzo, scostamento, storico
    const per={};
    righe.forEach(r=>{
      const a=S.articoli.find(x=>x.id===r.articolo_id);
      const sc=calcScostamento(r,a);
      const k=r.nome_snapshot;
      per[k]=per[k]||{nome:k, um:r.qta_um||'', punti:[]};
      per[k].punti.push({ data:r.ord_ordini.data, forn:r.fornitore, unit:sc?sc.unit:null, snap:sc?sc.snap:null,
        scost:sc&&sc.comparabile?sc.scost:null, comparabile:!!(sc&&sc.comparabile) });
    });
    const articoli=Object.values(per).map(g=>{
      g.punti.sort((a,b)=>a.data.localeCompare(b.data));
      g.ultimo=g.punti[g.punti.length-1];
      return g;
    });
    // ordina per scostamento assoluto dell'ultimo prezzo
    const evid = articoli.filter(g=>g.ultimo.scost!=null && (sog===0 || Math.abs(g.ultimo.scost)>=sog))
                         .sort((a,b)=>Math.abs(b.ultimo.scost)-Math.abs(a.ultimo.scost));

    res.innerHTML = `
      <div class="card" style="text-align:center">
        <div class="muted">Spesa reale nel periodo (IVA escl.)</div>
        <div class="dsp" style="font-size:26px;font-weight:700">€ ${numIT(spesoReale)}</div>
        ${diffPct!=null?`<div style="margin-top:4px">vs listino € ${numIT(attesoListino)} · <b style="color:${diff>0?'var(--warn)':'var(--acc)'}">${diff>0?'+':''}${numIT(diff)} € (${diffPct>0?'+':''}${diffPct.toFixed(1)}%)</b></div>
          <div class="muted" style="font-size:11px;margin-top:3px">confronto su ${confrontabili} ricezioni con unità allineata al listino</div>`:'<div class="muted" style="margin-top:4px">nessuna ricezione confrontabile col listino</div>'}
      </div>
      <h3 style="margin:14px 0 8px;font-size:14px">Scostamenti oltre soglia (${evid.length})</h3>
      ${evid.length?evid.map((g,i)=>{
        const u=g.ultimo, seg=u.scost>0?'+':'', col=u.scost>0?'var(--warn)':'var(--acc)';
        return `<div class="card">
          <div style="display:flex;align-items:baseline;gap:8px">
            <div style="flex:1;font-weight:600">${esc(g.nome)}</div>
            <div style="text-align:right"><b style="color:${col};font-size:17px">${seg}${u.scost.toFixed(1)}%</b>
              <div class="muted" style="font-size:11.5px">€ ${numIT(u.unit)} vs listino € ${numIT(u.snap)}</div></div>
          </div>
          <button class="chip" data-st="${articoli.indexOf(g)}" style="margin-top:8px">Storico prezzi (${g.punti.length})</button>
          <div id="st-${articoli.indexOf(g)}" class="hide" style="margin-top:8px">
            ${g.punti.map(p=>`<div style="padding:5px 0;border-top:1px solid var(--line);font-size:13px">
              <b>${dataIT(p.data)}</b>${p.forn?' · '+esc(p.forn):''} — € ${numIT(p.unit)}/${esc(g.um)}
              ${p.comparabile?` · <span style="color:${p.scost>0?'var(--warn)':'var(--acc)'}">${p.scost>0?'+':''}${p.scost.toFixed(1)}%</span>`:' · <span class="muted">non confrontabile</span>'}
            </div>`).join('')}
          </div>
        </div>`;
      }).join(''):'<div class="empty">Nessuno scostamento oltre la soglia scelta.</div>'}
      <h3 style="margin:14px 0 8px;font-size:14px">Tutti gli articoli con prezzo ricevuto (${articoli.length})</h3>
      ${articoli.sort((a,b)=>a.nome.localeCompare(b.nome)).map(g=>{
        const u=g.ultimo;
        return `<div style="padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline">
          <div style="flex:1">${esc(g.nome)}</div>
          <div class="muted">€ ${numIT(u.unit)}/${esc(g.um)}</div>
          ${u.scost!=null?`<b style="color:${u.scost>0?'var(--warn)':'var(--acc)'};min-width:56px;text-align:right">${u.scost>0?'+':''}${u.scost.toFixed(1)}%</b>`:'<span class="muted" style="min-width:56px;text-align:right">—</span>'}
        </div>`;
      }).join('')}`;
    res.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{ document.getElementById('st-'+b.dataset.st).classList.toggle('hide'); });
  }
}

/* ============================================================
   ANAGRAFICA FORNITORI
   ============================================================ */
async function vistaFornitori(){
  S.view='fornitori'; $('#savebar').classList.add('hide'); $('#btn-back').classList.remove('hide'); $('#sector-tabs').innerHTML='';
  $('#h-title').textContent='Fornitori'; $('#h-sub').textContent='Nome ed email per l’invio degli ordini';
  await caricaFornitori();
  $('#main').innerHTML = `<div style="display:flex;gap:8px;margin-bottom:10px">
      <button class="btn" style="flex:1" id="btn-addf">＋ Nuovo fornitore</button>
      <button class="btn ghost" id="btn-mergef">🔗 Unisci / sposta</button></div>` +
    (S.fornitori.map(f=>`<div class="card" data-f="${f.id}" style="cursor:pointer;display:flex;align-items:center;gap:10px">
      <div style="flex:1">
        <div style="font-weight:600">${esc(f.nome)}</div>
        <div class="muted">${f.email?esc(f.email):'<span style="color:var(--warn)">nessuna email</span>'}${f.telefono?' · '+esc(f.telefono):''}</div>
      </div><span class="muted">›</span></div>`).join('') || '<div class="empty">Nessun fornitore.</div>');
  $('#btn-addf').onclick=()=>schedaFornitore(null);
  $('#btn-mergef').onclick=()=>unisciFornitori();
  $('#main').querySelectorAll('[data-f]').forEach(c=>c.onclick=()=>schedaFornitore(S.fornitori.find(f=>f.id==c.dataset.f)));
}

/* ---------------- UNISCI / SPOSTA FORNITORI ---------------- */
async function contaArticoliFornitore(nome){
  // primario esatto, alternativo esatto, oppure dentro un campo multiplo "A / B / C"
  const { data } = await sb.from('ord_articoli').select('id,venditore_primario,venditore_alternativo');
  const n = nome.trim().toLowerCase();
  const dentroMultiplo = (v) => v && v.includes('/') && v.split('/').map(s=>s.trim().toLowerCase()).includes(n);
  return (data||[]).filter(a=>{
    const p=(a.venditore_primario||'').trim().toLowerCase(), s=(a.venditore_alternativo||'').trim().toLowerCase();
    return p===n || s===n || dentroMultiplo(a.venditore_primario) || dentroMultiplo(a.venditore_alternativo);
  });
}

function unisciFornitori(){
  const elencoTieni = S.fornitori.map(f=>`<option value="${f.id}">${esc(f.nome)}</option>`).join('');
  modal('Unisci fornitori', `
    <p class="muted">Sposta gli articoli da uno o più fornitori doppi verso quello da tenere, poi elimina i doppioni.</p>
    <label class="f"><span>Fornitore da tenere</span>
      <select class="inp" id="uf-keep"><option value="">— scegli —</option>${elencoTieni}</select></label>
    <label class="f"><span>Fornitori da eliminare (spostano qui i loro articoli)</span>
      <div class="chipwrap" id="uf-drop">${S.fornitori.map(f=>`<button type="button" class="chip" data-id="${f.id}" data-nome="${esc(f.nome)}">${esc(f.nome)}</button>`).join('')}</div></label>
    <div id="uf-info" class="muted"></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn ghost" style="flex:1" id="m-x">Annulla</button>
      <button class="btn" style="flex:1" id="m-ok">Conta articoli →</button></div>`,
   sh=>{
     const drop=new Set();
     const keep=sh.querySelector('#uf-keep');
     const info=sh.querySelector('#uf-info');
     sh.querySelectorAll('#uf-drop .chip').forEach(b=>b.onclick=()=>{
       const id=b.dataset.id;
       if(keep.value && id===keep.value){ alert('Questo è il fornitore da tenere: non puoi eliminarlo.'); return; }
       drop.has(id)?drop.delete(id):drop.add(id); b.classList.toggle('on'); info.textContent='';
     });
     sh.querySelector('#m-x').onclick=chiudiModal;
     sh.querySelector('#m-ok').onclick=async()=>{
       const keepF=S.fornitori.find(f=>String(f.id)===keep.value);
       if(!keepF){ alert('Scegli il fornitore da tenere.'); return; }
       const dropF=[...drop].map(id=>S.fornitori.find(f=>String(f.id)===id)).filter(f=>f && f.id!==keepF.id);
       if(!dropF.length){ alert('Scegli almeno un fornitore da eliminare.'); return; }
       info.textContent='Conto gli articoli…';
       let totale=0; const perNome={};
       for(const f of dropF){ const art=await contaArticoliFornitore(f.nome); perNome[f.nome]=art; totale+=art.length; }
       confermaUnione(keepF, dropF, perNome, totale);
     };
   });
}

function confermaUnione(keepF, dropF, perNome, totale){
  modal('Confermi l\'unione?', `
    <p>Tutti gli articoli di <b>${dropF.map(f=>esc(f.nome)).join(', ')}</b> passeranno a <b>${esc(keepF.nome)}</b>.</p>
    <div class="card">${dropF.map(f=>`<div style="display:flex;justify-content:space-between;padding:3px 0">
      <span>${esc(f.nome)}</span><b>${perNome[f.nome].length} articoli</b></div>`).join('')}
      <div style="display:flex;justify-content:space-between;padding:6px 0 0;border-top:1px solid var(--line);margin-top:6px">
      <span>Totale da spostare</span><b>${totale}</b></div></div>
    <label class="f"><span>Gli ordini già emessi</span>
      <select class="inp" id="uf-storico">
        <option value="no">Lasciali com'erano (nome storico sul documento)</option>
        <option value="si">Allinea anche gli ordini passati al nuovo nome</option>
      </select></label>
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn ghost" style="flex:1" id="m-x">Indietro</button>
      <button class="btn" style="flex:1" id="m-ok">Unisci</button></div>`,
   sh=>{
     sh.querySelector('#m-x').onclick=()=>unisciFornitori();
     sh.querySelector('#m-ok').onclick=async()=>{
       const allineaStorico = sh.querySelector('#uf-storico').value==='si';
       const btn=sh.querySelector('#m-ok'); btn.disabled=true; btn.textContent='Unisco…';
       try{
         for(const f of dropF){
           const nome=f.nome, nl=nome.trim().toLowerCase();
           // aggiorna gli articoli: primario, alternativo, campi multipli
           for(const a of perNome[nome]){
             const { data:rows } = await sb.from('ord_articoli').select('id,venditore_primario,venditore_alternativo').eq('id',a.id);
             const art=rows&&rows[0]; if(!art) continue;
             const rimpiazza = v => {
               if(!v) return v;
               if(v.trim().toLowerCase()===nl) return keepF.nome;
               if(v.includes('/')) return v.split('/').map(s=>s.trim().toLowerCase()===nl?keepF.nome:s.trim()).join(' / ');
               return v;
             };
             await sb.from('ord_articoli').update({
               venditore_primario:rimpiazza(art.venditore_primario),
               venditore_alternativo:rimpiazza(art.venditore_alternativo)
             }).eq('id',art.id);
           }
           // ordini passati (righe con fornitore congelato)
           if(allineaStorico) await sb.from('ord_righe').update({fornitore:keepF.nome}).eq('fornitore',nome);
           // elimina la voce doppia
           await sb.from('ord_fornitori').update({attivo:false}).eq('id',f.id);
         }
         await Promise.all([caricaFornitori(), caricaArticoli()]);
         chiudiModal(); vistaFornitori(); toast('Fornitori uniti');
       }catch(e){ alert('Errore durante l\'unione: '+e.message); btn.disabled=false; btn.textContent='Unisci'; }
     };
   });
}

function schedaFornitore(f){
  const nuovo=!f; f = f || { nome:'', email:'', telefono:'', note:'' };
  modal(nuovo?'Nuovo fornitore':'Scheda fornitore', `
    <label class="f"><span>Nome</span><input class="inp" id="f-nome" value="${esc(f.nome)}"></label>
    <label class="f"><span>Email</span><input class="inp" id="f-mail" type="email" value="${esc(f.email||'')}"></label>
    <label class="f"><span>Telefono</span><input class="inp" id="f-tel" value="${esc(f.telefono||'')}"></label>
    <label class="f"><span>Note</span><textarea class="inp" rows="2" id="f-note">${esc(f.note||'')}</textarea></label>
    <div style="display:flex;gap:8px;margin-top:6px">
      ${!nuovo?'<button class="btn warn" id="m-del">🗑</button>':''}
      <button class="btn ghost" style="flex:1" id="m-x">Annulla</button>
      <button class="btn" style="flex:1" id="m-ok">💾 Salva</button></div>`,
   sh=>{
     sh.querySelector('#m-x').onclick=chiudiModal;
     if(!nuovo) sh.querySelector('#m-del').onclick=async()=>{
       if(!confirm('Eliminare "'+f.nome+'"?\n\nGli ordini già fatti restano invariati.')) return;
       await sb.from('ord_fornitori').update({attivo:false}).eq('id',f.id);
       await caricaFornitori(); chiudiModal(); vistaFornitori(); toast('Fornitore eliminato');
     };
     sh.querySelector('#m-ok').onclick=async()=>{
       const rec={ nome:sh.querySelector('#f-nome').value.trim(), email:sh.querySelector('#f-mail').value.trim()||null,
                   telefono:sh.querySelector('#f-tel').value.trim()||null, note:sh.querySelector('#f-note').value.trim()||null };
       if(!rec.nome){ alert('Il nome è obbligatorio.'); return; }
       const { error } = f.id ? await sb.from('ord_fornitori').update(rec).eq('id',f.id) : await sb.from('ord_fornitori').insert(rec);
       if(error){ alert(error.code==='23505'?'Questo fornitore esiste già.':'Errore: '+error.message); return; }
       await caricaFornitori(); chiudiModal(); vistaFornitori(); toast('Fornitore salvato');
     };
   });
}

/* ---------------- MODALE + TOAST ---------------- */
function modal(titolo, html, init){
  const root=$('#modal-root');
  root.innerHTML=`<div class="ov"><div class="sheet"><h2>${esc(titolo)}</h2><div style="height:10px"></div>${html}</div></div>`;
  root.querySelector('.ov').onclick=e=>{ if(e.target.classList.contains('ov')) chiudiModal(); };
  if(init) init(root.querySelector('.sheet'));
}
function chiudiModal(){ $('#modal-root').innerHTML=''; }
function toast(t){
  const d=document.createElement('div'); d.textContent=t;
  d.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:70;font-size:14px;box-shadow:0 6px 20px #16202b40';
  document.body.appendChild(d); setTimeout(()=>d.remove(),1800);
}
</script>
